<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVO LAUNCH · Manual de Oferta y Venta</title>
<style>
/* ============================ SISTEMA VISUAL EVO LAUNCH ============================ */
:root{
  --bg:#0E0F16;
  --surface:#171826;
  --surface-2:#1E2032;
  --surface-3:#262A40;
  --border:#2C3048;
  --border-soft:#232640;
  --text:#E9EAF2;
  --text-muted:#9EA0B8;
  --text-dim:#6E7192;
  --primary:#7B3FE4;
  --primary-soft:rgba(123,63,228,.14);
  --primary-bright:#9B6BF0;
  --secondary:#0FB5C9;
  --secondary-soft:rgba(15,181,201,.14);
  --verde:#1D8A5F;   --verde-bg:rgba(29,138,95,.16);   --verde-tx:#4FD39B;
  --ambar:#B07200;   --ambar-bg:rgba(176,114,0,.16);   --ambar-tx:#E0A83A;
  --rojo:#C43B4E;    --rojo-bg:rgba(196,59,78,.16);    --rojo-tx:#F0788A;
  --font:'Poppins','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --radius:12px; --radius-sm:8px;
  --sidebar-w:264px;
  --shadow:0 4px 20px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#F4F5F9;
  --surface:#FFFFFF;
  --surface-2:#FBFBFE;
  --surface-3:#EEF0F7;
  --border:#DADDEA;
  --border-soft:#E7E9F2;
  --text:#171826;
  --text-muted:#565A72;
  --text-dim:#82869E;
  --primary:#6B2FD4;
  --primary-soft:rgba(107,47,212,.10);
  --primary-bright:#7B3FE4;
  --secondary:#0A8EA0;
  --secondary-soft:rgba(10,142,160,.10);
  --verde:#157A50; --verde-bg:rgba(21,122,80,.12); --verde-tx:#12784E;
  --ambar:#8F5D00; --ambar-bg:rgba(143,93,0,.12);  --ambar-tx:#8A5A00;
  --rojo:#B22F42;  --rojo-bg:rgba(178,47,66,.10);   --rojo-tx:#B0273A;
  --shadow:0 3px 14px rgba(20,24,45,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--secondary);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--secondary);outline-offset:2px;border-radius:4px}

/* ============================ LAYOUT ============================ */
.app{display:flex;min-height:100vh}

/* ---- Sidebar ---- */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  position:fixed;top:0;left:0;bottom:0;
  display:flex;flex-direction:column;
  z-index:40;
}
.sb-brand{padding:18px 20px 14px;border-bottom:1px solid var(--border-soft)}
.sb-brand .logo{font-weight:700;font-size:17px;letter-spacing:.06em}
.sb-brand .logo span{color:var(--primary-bright)}
.sb-brand .sub{font-size:11px;color:var(--text-dim);margin-top:2px;letter-spacing:.02em}
.sb-search{padding:12px 14px;border-bottom:1px solid var(--border-soft);position:relative}
.sb-search input{
  width:100%;padding:9px 12px 9px 34px;font-size:13.5px;
  background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);
}
.sb-search input::placeholder{color:var(--text-dim)}
.sb-search .ico{position:absolute;left:24px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}
.sb-nav{overflow-y:auto;flex:1;padding:8px 10px 20px}
.sb-nav a{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:var(--radius-sm);
  color:var(--text-muted);font-size:13.5px;font-weight:500;
  transition:background .12s,color .12s;
}
.sb-nav a .n{
  flex-shrink:0;width:22px;height:22px;border-radius:6px;
  display:grid;place-items:center;font-size:11px;font-weight:600;
  background:var(--surface-3);color:var(--text-dim);
}
.sb-nav a:hover{background:var(--surface-2);color:var(--text)}
.sb-nav a.active{background:var(--primary-soft);color:var(--text)}
.sb-nav a.active .n{background:var(--primary);color:#fff}
.sb-foot{padding:10px 14px;border-top:1px solid var(--border-soft);display:flex;gap:8px;align-items:center}
.theme-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:8px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-3);font-size:12.5px;font-weight:500;color:var(--text-muted);
}
.theme-btn:hover{color:var(--text);border-color:var(--primary)}

/* ---- Main ---- */
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;padding:0 0 120px}
.content{max-width:960px;margin:0 auto;padding:28px 32px}

/* ---- Section shell ---- */
.section{padding-top:26px;margin-top:8px;scroll-margin-top:16px}
.sec-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
.sec-num{
  flex-shrink:0;width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),#5B2BB0);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;
  box-shadow:0 2px 10px var(--primary-soft);
}
.sec-head h2{font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.sec-bajada{color:var(--text-muted);font-size:14px;margin:2px 0 18px 54px;font-style:italic}
h3.blk{font-size:15px;font-weight:650;margin:22px 0 10px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
h3.blk::before{content:"";width:3px;height:15px;background:var(--secondary);border-radius:2px}
p.para{color:var(--text-muted);margin:10px 0;font-size:14px;max-width:74ch}

/* ---- Cards / callouts ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin:14px 0}
.callout{border-left:4px solid var(--primary);background:var(--surface);border-radius:var(--radius-sm);padding:14px 16px;margin:14px 0}
.callout .ct{font-weight:650;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--primary-bright);margin-bottom:6px}
.callout.q{border-left-color:var(--secondary)}
.callout.q .ct{color:var(--secondary)}
.callout.warn{border-left-color:var(--ambar);background:var(--ambar-bg)}
.callout.warn .ct{color:var(--ambar-tx)}
.callout.danger{border-left-color:var(--rojo);background:var(--rojo-bg)}
.callout.danger .ct{color:var(--rojo-tx)}
.callout p{font-size:14px;color:var(--text);margin:4px 0}
.callout.quote p{font-style:italic}
.regla-cero{border:1px solid var(--rojo);background:var(--rojo-bg);border-radius:var(--radius);padding:16px 18px;margin:18px 0}
.regla-cero .ct{color:var(--rojo-tx);font-weight:700;letter-spacing:.06em;font-size:13px;margin-bottom:6px}

ul.lst{margin:8px 0 8px 2px;list-style:none}
ul.lst li{position:relative;padding-left:20px;margin:7px 0;font-size:14px;color:var(--text-muted)}
ul.lst li::before{content:"";position:absolute;left:4px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--secondary)}
ol.lst{margin:8px 0 8px 22px}
ol.lst li{margin:7px 0;font-size:14px;color:var(--text-muted);padding-left:4px}

/* ---- Tables ---- */
.tbl-wrap{overflow-x:auto;margin:12px 0;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
thead th{
  background:var(--surface-3);color:var(--text);font-weight:650;text-align:left;
  padding:10px 13px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12.5px;
  position:sticky;top:0;
}
tbody td{padding:10px 13px;border-bottom:1px solid var(--border-soft);color:var(--text-muted);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
/* Primera columna fija en scroll horizontal */
.tbl-sticky table td:first-child,.tbl-sticky table th:first-child{
  position:sticky;left:0;z-index:2;background:var(--surface);
  font-weight:600;color:var(--text);border-right:1px solid var(--border);
}
.tbl-sticky table thead th:first-child{background:var(--surface-3);z-index:3}
.tbl-sticky table tbody tr:hover td:first-child{background:var(--surface-2)}
td .num,.num{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.money{color:var(--secondary);font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}

/* chips semáforo */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:650;letter-spacing:.02em}
.chip.v{background:var(--verde-bg);color:var(--verde-tx)}
.chip.a{background:var(--ambar-bg);color:var(--ambar-tx)}
.chip.r{background:var(--rojo-bg);color:var(--rojo-tx)}
.chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* verdict coloring inside tables */
.vd-inviable{color:var(--rojo-tx);font-weight:600}
.vd-limite{color:var(--ambar-tx);font-weight:600}
.vd-sano,.vd-bueno{color:var(--verde-tx);font-weight:600}

/* two-column blocks */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.grid2 .card{margin:0}

/* tier cards */
.tier{border:1px solid var(--border);border-radius:var(--radius);padding:0;overflow:hidden;margin:16px 0;background:var(--surface)}
.tier-head{padding:16px 18px;border-bottom:1px solid var(--border)}
.tier-head.t1{background:linear-gradient(135deg,rgba(15,181,201,.12),transparent)}
.tier-head.t2{background:linear-gradient(135deg,var(--primary-soft),transparent);border-bottom-color:var(--primary)}
.tier-head.t3{background:linear-gradient(135deg,rgba(110,113,146,.12),transparent)}
.tier-tag{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text-dim)}
.tier-head.t2 .tier-tag{color:var(--primary-bright)}
.tier-name{font-size:18px;font-weight:700;margin:3px 0 4px}
.tier-price{font-size:15px;font-weight:650;color:var(--secondary);margin:8px 0 3px;font-variant-numeric:tabular-nums}
.tier-cond{font-size:12px;color:var(--text-dim)}
.tier-para{font-size:13.5px;color:var(--text-muted);margin-top:8px}
.tier-body{padding:16px 18px}
.tier-body .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tier-body h4{font-size:11.5px;letter-spacing:.05em;color:var(--text-dim);font-weight:650;margin-bottom:8px}

/* ============================ HERRAMIENTAS ============================ */
.tool{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin:16px 0;overflow:hidden}
.tool-head{padding:13px 16px;background:var(--surface-3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tool-head .tt{font-weight:650;font-size:14px;display:flex;align-items:center;gap:8px}
.tool-head .tt .badge{font-size:10px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--primary);padding:2px 7px;border-radius:20px}
.tool-body{padding:16px}
.tool-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 13px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);display:inline-flex;align-items:center;gap:6px}
.btn:hover{color:var(--text);border-color:var(--primary)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-bright)}
.btn.on{background:var(--secondary);color:#04252a;border-color:var(--secondary)}

/* inputs / sliders */
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.ctrl label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctrl label .val{color:var(--secondary);font-weight:700;font-variant-numeric:tabular-nums}
.ctrl .row{display:flex;align-items:center;gap:10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;background:var(--surface-3);outline-offset:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--primary-bright);cursor:pointer;border:2px solid var(--surface)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--primary-bright);cursor:pointer;border:2px solid var(--surface)}
input[type=number],select{
  padding:7px 10px;font-size:13px;background:var(--surface-3);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text);font-variant-numeric:tabular-nums;
}
input[type=number]{width:96px}
select{width:100%}
.num-in{width:88px;flex-shrink:0}
.toggle{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;color:var(--text-muted);font-weight:500}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle .sw{width:38px;height:21px;border-radius:20px;background:var(--surface-3);border:1px solid var(--border);position:relative;transition:.15s;flex-shrink:0}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--text-dim);transition:.15s}
.toggle input:checked + .sw{background:var(--primary-soft);border-color:var(--primary)}
.toggle input:checked + .sw::after{transform:translateX(17px);background:var(--primary-bright)}

/* outputs */
.out-split{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px}
.out-block{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.out-block .obh{padding:9px 14px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px}
.out-block.prospecto .obh{background:var(--secondary-soft);color:var(--secondary)}
.out-block.nuestro .obh{background:var(--primary-soft);color:var(--primary-bright);cursor:pointer}
.out-rows{padding:6px 14px 12px}
.orow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border-soft);font-size:13.5px}
.orow:last-child{border-bottom:none}
.orow .k{color:var(--text-muted)}
.orow .v{font-weight:650;font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap}
.orow.neg .v{color:var(--rojo-tx)}
.orow.total{margin-top:2px;padding-top:10px;border-top:2px solid var(--border);border-bottom:none}
.orow.total .k{font-weight:650;color:var(--text)}
.orow.total .v{font-size:20px;color:var(--secondary)}
.orow.roi .v{color:var(--primary-bright);font-size:16px}
.paga-frase{margin-top:12px;padding:11px 14px;background:var(--primary-soft);border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:var(--text);text-align:center}
.paga-frase b{color:var(--primary-bright);font-size:17px}
.semaforo-box{margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.semaforo-box .lz{font-size:26px;line-height:1}
.semaforo-box .txt strong{display:block;font-size:15px}
.semaforo-box .txt span{font-size:12.5px;color:var(--text-muted)}
.sf-inviable{background:var(--rojo-bg);border-color:var(--rojo)} .sf-inviable strong{color:var(--rojo-tx)}
.sf-limite{background:var(--ambar-bg);border-color:var(--ambar)} .sf-limite strong{color:var(--ambar-tx)}
.sf-sano{background:var(--verde-bg);border-color:var(--verde)} .sf-sano strong{color:var(--verde-tx)}
.sf-muybueno{background:var(--verde-bg);border-color:var(--verde)} .sf-muybueno strong{color:var(--verde-tx)}
.sf-excelente{background:var(--secondary-soft);border-color:var(--secondary)} .sf-excelente strong{color:var(--secondary)}
.collapsed .out-rows{display:none}
.nuestro .obh .arw{transition:transform .15s}
.collapsed .obh .arw{transform:rotate(-90deg)}

/* modo presentación */
.tool.presenta .nuestro{display:none}
.tool.presenta{box-shadow:0 0 0 2px var(--secondary)}
.tool.presenta .tool-body{font-size:112%}
.tool.presenta .orow{padding:9px 0}
.tool.presenta .orow.total .v{font-size:24px}
.tool.presenta .paga-frase b{font-size:20px}

/* garantía / cualificador */
.result-num{font-size:40px;font-weight:800;color:var(--secondary);font-variant-numeric:tabular-nums;line-height:1}
.copy-area{position:relative;margin-top:12px}
.copy-txt{background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;font-size:13.5px;color:var(--text);line-height:1.55}
.copy-btn{position:absolute;top:8px;right:8px}

.qual-q{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin:9px 0;background:var(--surface-2)}
.qual-q .qh{display:flex;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:9px}
.qual-q .qh .qn{color:var(--text-dim);flex-shrink:0}
.qual-q .diamond{color:var(--primary-bright);font-size:11px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{padding:6px 12px;font-size:12.5px;border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--text-muted);transition:.12s}
.opt:hover{border-color:var(--primary);color:var(--text)}
.opt.sel{background:var(--primary);border-color:var(--primary);color:#fff}
.opt.sel.rojo{background:var(--rojo);border-color:var(--rojo)}
.opt.sel.amarillo{background:var(--ambar);border-color:var(--ambar)}
.opt.sel.verde{background:var(--verde);border-color:var(--verde)}
.qual-regla{font-size:11.5px;color:var(--text-dim);margin-top:8px;font-style:italic}

.qual-result{margin-top:8px}
.qr-banner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--radius);border:1px solid var(--border)}
.qr-banner .big{font-size:30px}
.qr-banner .rt strong{display:block;font-size:18px}
.qr-tier{margin-top:12px;padding:12px 15px;border-radius:var(--radius-sm);background:var(--surface-3);font-size:14px}
.qr-tier b{color:var(--primary-bright)}
.qr-list{margin-top:10px}
.qr-list .qri{display:flex;gap:9px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--border-soft);color:var(--text-muted)}
.qr-list .qri:last-child{border:none}

/* accordion objeciones */
.acc-item{border:1px solid var(--border);border-radius:var(--radius-sm);margin:9px 0;overflow:hidden;background:var(--surface)}
.acc-head{width:100%;text-align:left;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px;font-weight:600;color:var(--text)}
.acc-head:hover{background:var(--surface-2)}
.acc-head .arw{color:var(--text-dim);transition:transform .18s;flex-shrink:0}
.acc-item.open .acc-head{background:var(--primary-soft)}
.acc-item.open .acc-head .arw{transform:rotate(90deg);color:var(--primary-bright)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .22s ease}
.acc-body-inner{padding:0 16px 15px}
.acc-body-inner .detras{font-size:12.5px;color:var(--text-dim);font-style:italic;margin:6px 0 10px;padding-left:11px;border-left:2px solid var(--border)}
.acc-body-inner .resp{font-size:14px;color:var(--text);line-height:1.6}

/* checklist */
.check-item{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:14px;align-items:flex-start;cursor:pointer}
.check-item:last-child{border:none}
.check-item .cbox{flex-shrink:0;width:20px;height:20px;border:2px solid var(--border);border-radius:5px;display:grid;place-items:center;margin-top:1px;transition:.12s}
.check-item.done .cbox{background:var(--verde);border-color:var(--verde);color:#fff}
.check-item.done .ctxt{color:var(--text-dim);text-decoration:line-through}
.check-num{color:var(--text-dim);font-weight:600;flex-shrink:0;font-size:13px;margin-top:1px}

/* conflict marker + notas */
.cflag{display:inline-block;color:var(--ambar-tx);font-size:11px;cursor:help;margin-left:4px;vertical-align:super;font-weight:700}
.notas-panel{border:1px solid var(--ambar);border-radius:var(--radius);margin:20px 0;background:var(--ambar-bg);overflow:hidden}
.notas-panel > summary{padding:13px 16px;font-weight:650;font-size:13.5px;color:var(--ambar-tx);cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.notas-panel > summary::-webkit-details-marker{display:none}
.notas-panel[open] > summary{border-bottom:1px solid var(--ambar)}
.notas-inner{padding:6px 16px 14px}
.nota{padding:11px 0;border-bottom:1px dashed rgba(176,114,0,.35);font-size:13px}
.nota:last-child{border:none}
.nota b{color:var(--text)}
.nota .why{color:var(--text-muted);display:block;margin-top:3px}

/* floating price button */
.fab{
  position:fixed;right:22px;bottom:22px;z-index:45;
  background:var(--primary);color:#fff;border-radius:30px;
  padding:12px 18px;font-size:13.5px;font-weight:650;
  box-shadow:0 6px 22px rgba(123,63,228,.45);display:flex;align-items:center;gap:8px;
}
.fab:hover{background:var(--primary-bright)}
.fab kbd{background:rgba(255,255,255,.22);border-radius:4px;padding:1px 5px;font-size:10.5px;font-family:inherit}

/* search results overlay */
.search-results{
  position:absolute;top:100%;left:14px;right:14px;margin-top:4px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  box-shadow:var(--shadow);max-height:60vh;overflow-y:auto;z-index:60;display:none;
}
.search-results.show{display:block}
.sr-item{padding:10px 13px;border-bottom:1px solid var(--border-soft);cursor:pointer}
.sr-item:hover,.sr-item.hl{background:var(--primary-soft)}
.sr-item .sr-sec{font-size:10.5px;color:var(--primary-bright);font-weight:650;text-transform:uppercase;letter-spacing:.03em}
.sr-item .sr-txt{font-size:13px;color:var(--text-muted);margin-top:2px;line-height:1.4}
.sr-item mark{background:var(--secondary-soft);color:var(--secondary);padding:0 2px;border-radius:2px}
.sr-empty{padding:14px;font-size:13px;color:var(--text-dim);text-align:center}

/* highlight target on nav */
@keyframes flashsec{0%{background:var(--secondary-soft)}100%{background:transparent}}
.flash{animation:flashsec 1.4s ease}

/* mobile bottom bar */
.mbar{display:none}
.mobile-menu{display:none}

/* cover */
.cover{padding:26px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px}
.cover .kick{font-size:12px;letter-spacing:.14em;color:var(--primary-bright);font-weight:650}
.cover h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.cover .subt{color:var(--text-muted);font-size:14.5px}
.cover-meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;font-size:12.5px}
.cover-meta div span{color:var(--text-dim)}
.cover-meta div b{color:var(--text);font-weight:600}

/* ============================ RESPONSIVE ============================ */
@media(max-width:860px){
  .sidebar{transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .content{padding:16px 15px 40px}
  .mobile-menu{
    display:flex;position:sticky;top:0;z-index:35;align-items:center;justify-content:space-between;
    padding:11px 15px;background:var(--surface);border-bottom:1px solid var(--border);gap:12px;
  }
  .mobile-menu .mm-title{font-weight:700;font-size:14px;letter-spacing:.04em}
  .mobile-menu .mm-title span{color:var(--primary-bright)}
  .burger{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:18px;line-height:1;color:var(--text)}
  .grid2,.tier-body .cols,.ctrls{grid-template-columns:1fr}
  .cover h1{font-size:24px}
  .sec-head h2{font-size:20px}
  .sec-bajada{margin-left:0}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:38;display:none}
  .backdrop.show{display:block}
  .fab{bottom:16px;right:16px;padding:11px 15px}
}
@media(max-width:400px){
  .content{padding:14px 11px 40px}
  .sec-num{width:34px;height:34px;font-size:15px}
  .sec-head h2{font-size:18px}
  .tool-body{padding:12px}
  .fab kbd{display:none}
}

/* ============================ PRINT ============================ */
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#fff;--surface-3:#f2f2f4;--border:#c9ccd8;--border-soft:#e2e4ec;--text:#111;--text-muted:#333;--text-dim:#666}
  html[data-theme]{--bg:#fff}
  body{background:#fff;color:#111;font-size:11pt}
  .sidebar,.mobile-menu,.mbar,.fab,.backdrop,.search-results,.tool-actions,.sb-search,
  .tool .tool-head .tool-actions{display:none !important}
  .main{margin-left:0}
  .content{max-width:100%;padding:0}
  .tool{border:1px solid #ccc}
  .tool-body{display:none}          /* herramientas interactivas ocultas en impresión */
  .tool-head::after{content:"— herramienta interactiva (ver versión web)";font-weight:400;font-style:italic;color:#666;font-size:10pt;margin-left:8px}
  .acc-body{max-height:none !important}   /* acordeones desplegados */
  .acc-body-inner{padding:0 16px 12px}
  .collapsed .out-rows{display:block}
  .section{page-break-inside:auto;padding-top:14px}
  .tier,.card,.tbl-wrap,.callout,.acc-item{page-break-inside:avoid}
  .sec-head h2{font-size:16pt}
  a{color:#111;text-decoration:none}
  .notas-panel{border-color:#999}
  details[open] .notas-inner,.notas-panel{display:block}
  .notas-panel > summary{color:#111}
}
</style>
</head>

<script src="data.js"></script>
<script>
/* =========================================================================
   EVO LAUNCH — index.html · Vanilla JS. Todo el contenido sale de data.js.
   ========================================================================= */
const $  = (s,c=document)=>c.querySelector(s);
const $$ = (s,c=document)=>Array.from(c.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = n => '$'+Number(Math.round(n)).toLocaleString('en-US');
const D = window.DATA, P = window.PRECIOS;

/* ---- helpers de render ---- */
function tabla(headers, filas, {sticky=true, verdictCol=-1, moneyCols=[]}={}){
  const th = headers.map(h=>`<th>${esc(h)}</th>`).join('');
  const body = filas.map(fila=>{
    const tds = fila.map((c,i)=>{
      let cls='';
      if(i===verdictCol) cls=' class="'+verdictClass(c)+'"';
      else if(moneyCols.includes(i)) cls=' class="money"';
      return `<td${cls}>${cellFmt(c)}</td>`;
    }).join('');
    return `<tr>${tds}</tr>`;
  }).join('');
  return `<div class="tbl-wrap${sticky?' tbl-sticky':''}"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}
// resalta Sí/No y semáforos dentro de celdas
function cellFmt(c){
  const t=String(c);
  if(t==='Sí') return '<span class="chip v" style="padding:1px 8px">Sí</span>';
  if(t==='No') return '<span style="color:var(--text-dim)">No</span>';
  return esc(t);
}
function verdictClass(t){
  t=String(t).toLowerCase();
  if(t.startsWith('inviable')) return 'vd-inviable';
  if(t.startsWith('límite')||t.startsWith('limite')) return 'vd-limite';
  if(t.startsWith('sano')) return 'vd-sano';
  return 'vd-bueno';
}
function callout(cls,title,html){
  return `<div class="callout ${cls}">${title?`<div class="ct">${esc(title)}</div>`:''}${html}</div>`;
}
function listaUL(arr){return `<ul class="lst">${arr.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;}
function listaOL(arr){return `<ol class="lst">${arr.map(i=>`<li>${esc(i)}</li>`).join('')}</ol>`;}
function secHead(num,titulo,bajada){
  return `<div class="sec-head"><div class="sec-num">${esc(num)}</div><h2>${esc(titulo)}</h2></div>`+
         (bajada?`<p class="sec-bajada">${esc(bajada)}</p>`:'');
}

/* ---- CONFLICTOS detectados en el PDF (no corregidos) ---- */
const CONFLICTOS=[
  {id:'c1',ref:'Sección 5 / 6 — Setup Tier 3',
   txt:'La caja del Tier 3 (Sección 5) dice "setup de $500 a $800", pero la hoja de precios (Sección 6) dice "$500 – $1,200". El $1,200 coincide con el setup del módulo suelto Embudo/VSL, lo que sugiere un arrastre.',
   why:'Sin corregir. Guardado tal cual en ambas secciones.'},
  {id:'c2',ref:'Sección 6 — Facturación nuestra mes 1, Tier 2',
   txt:'Figura $5,000, pero el Tier 2 base es setup $3,000 + fee $1,500 = $4,500. El $5,000 solo cierra asumiendo el Módulo de Cierre (fee $2,000): $3,000 + $2,000.',
   why:'La columna se titula "Tier 2 (flagship)", sin indicar el módulo.'},
  {id:'c3',ref:'Sección 6 — Facturación nuestra mes 3+, Tier 2',
   txt:'Figura $4,000, que es el "lo que facturamos" de la Tabla C con módulo (fee $2,000 + 20%). El Tier 2 base (fee $1,500 + 15% sobre $10,000) daría $3,000.',
   why:'Las filas de facturación del Tier 2 asumen el Módulo de Cierre, aunque el rótulo describe el tier pelado.'},
  {id:'c4',ref:'Sección 6 — Facturación nuestra mes 1, Tier 3',
   txt:'El techo "$2,000" cierra con setup $800 + fee $1,200 (usa el cap de $800 de la Sección 5), no con el $1,200 de la propia hoja de precios. Refuerza el conflicto #1.',
   why:'Sin corregir. Sugiere que el setup tope real del Tier 3 es $800.'}
];
function cflag(id){
  const c=CONFLICTOS.find(x=>x.id===id);
  return `<span class="cflag" title="${esc(c.ref+': '+c.txt)}" onclick="document.getElementById('notasPanel').open=true;document.getElementById('notasPanel').scrollIntoView({behavior:'smooth'})">⚠</span>`;
}

/* =========================================================================
   NAV
   ========================================================================= */
$('#nav').innerHTML = D.nav.map(s=>
  `<a href="#${s.id}" data-sec="${s.id}"><span class="n">${esc(s.num)}</span> ${esc(s.titulo)}</a>`
).join('');

/* =========================================================================
   RENDER DE SECCIONES
   ========================================================================= */
const C=$('#content');
let html='';

/* ---- Portada + Regla Cero ---- */
html+=`<div class="cover">
  <div class="kick">${esc(D.meta.marca)}</div>
  <h1>${esc(D.meta.titulo)}</h1>
  <div class="subt">${esc(D.meta.subtitulo)}</div>
  <div class="cover-meta">
    <div><span>Versión</span> <b>${esc(D.meta.version.replace('Versión ',''))}</b></div>
    <div><span>Fecha</span> <b>${esc(D.meta.fecha)}</b></div>
    <div><span>Director</span> <b>${esc(D.meta.director)}</b></div>
    <div><span>Dir. comercial</span> <b>${esc(D.meta.direccionComercial)}</b></div>
    <div><span>Estado</span> <b>${esc(D.meta.estado)}</b></div>
  </div>
</div>`;
html+=`<div class="regla-cero"><div class="ct">⛔ ${esc(D.reglaCero.titulo)}</div><p style="font-size:14px">${esc(D.reglaCero.texto)}</p></div>`;

/* ---- Panel de notas internas (conflictos) ---- */
html+=`<details class="notas-panel" id="notasPanel">
  <summary>⚠ Notas internas — ${CONFLICTOS.length} contradicciones detectadas en el PDF (no corregidas)</summary>
  <div class="notas-inner">
    <p class="qual-regla" style="margin:4px 0 8px">Contenido reproducido fiel al PDF. Estos puntos se señalan para decisión de dirección; ningún número fue alterado.</p>
    ${CONFLICTOS.map(c=>`<div class="nota"><b>${esc(c.ref)}</b> — ${esc(c.txt)}<span class="why">${esc(c.why)}</span></div>`).join('')}
  </div>
</details>`;

/* ===== SECCIÓN 0 ===== */
(()=>{const s=D.sec0;
  let h=`<section class="section" id="sec0">`+secHead(s.num,s.titulo,s.bajada);
  h+=tabla(s.tablaPerfiles.headers,s.tablaPerfiles.filas);
  h+=`<h3 class="blk">${esc(s.tresReglas.titulo)}</h3>`+listaOL(s.tresReglas.items);
  h+=`<h3 class="blk">${esc(s.queCambio.titulo)}</h3><p class="para">${esc(s.queCambio.intro)}</p>`;
  h+=tabla(s.queCambio.headers,s.queCambio.filas);
  h+=`</section>`; html+=h;
})();

/* ===== SECCIÓN 1 ===== */
(()=>{const s=D.sec1;
  let h=`<section class="section" id="sec1">`+secHead(s.num,s.titulo,s.bajada);
  h+=callout('q',s.frase.titulo,`<p>${esc(s.frase.texto)}</p>`);
  h+=`<h3 class="blk">${esc(s.reglasDiscurso.titulo)}</h3>`+tabla(s.reglasDiscurso.headers,s.reglasDiscurso.filas);
  h+=`<h3 class="blk">${esc(s.diferenciador.titulo)}</h3><p class="para">${esc(s.diferenciador.texto)}</p>`;
  h+=tabla(s.diferenciador.tabla.headers,s.diferenciador.tabla.filas);
  h+=callout('',s.argumentoCierra.titulo,`<p>${esc(s.argumentoCierra.texto)}</p>`);
  h+=`</section>`; html+=h;
})();

/* ===== SECCIÓN 2 ===== */
(()=>{const s=D.sec2;
  let h=`<section class="section" id="sec2">`+secHead(s.num,s.titulo,s.bajada);
  h+=`<p class="para">${esc(s.intro)}</p>`+tabla(s.variablesDuras.headers,s.variablesDuras.filas);
  h+=`<h3 class="blk">${esc(s.dosTipos.titulo)}</h3><p class="para">${esc(s.dosTipos.intro)}</p>`;
  h+=`<div class="grid2">
    <div class="card"><div style="color:var(--verde-tx);font-weight:700;font-size:13px;margin-bottom:4px">${esc(s.dosTipos.tipoA.titulo)}</div>
      <p class="para" style="margin:4px 0 8px"><b style="color:var(--text)">${esc(s.dosTipos.tipoA.etiqueta)}</b></p>
      ${listaUL(s.dosTipos.tipoA.rasgos)}
      <p class="para" style="font-size:13px">${esc(s.dosTipos.tipoA.porQue)}</p></div>
    <div class="card"><div style="color:var(--ambar-tx);font-weight:700;font-size:13px;margin-bottom:4px">${esc(s.dosTipos.tipoB.titulo)}</div>
      <p class="para" style="margin:4px 0 8px"><b style="color:var(--text)">${esc(s.dosTipos.tipoB.etiqueta)}</b></p>
      ${listaUL(s.dosTipos.tipoB.rasgos)}
      <p class="para" style="font-size:13px">${esc(s.dosTipos.tipoB.porQue)}</p></div>
  </div>`;
  h+=`<h3 class="blk">${esc(s.dondeEncontrar.titulo)}</h3>`+tabla(s.dondeEncontrar.headers,s.dondeEncontrar.filas);
  h+=callout('',s.ordenProspeccion.titulo,`<p>${esc(s.ordenProspeccion.texto)}</p>`);
  h+=`</section>`; html+=h;
})();

/* ===== SECCIÓN 3 ===== */
(()=>{const s=D.sec3;
  let h=`<section class="section" id="sec3">`+secHead(s.num,s.titulo,s.bajada);
  h+=tabla(s.descalificadores.headers,s.descalificadores.filas);
  h+=callout('danger',s.descalificacionAmable.titulo,`<p style="font-style:italic">${esc(s.descalificacionAmable.texto)}</p><p style="margin-top:8px">${esc(s.descalificacionAmable.cierre)}</p>`);
  h+=`</section>`; html+=h;
})();

/* ===== SECCIÓN 4 + Calculadora de aritmética ===== */
(()=>{const s=D.sec4;
  let h=`<section class="section" id="sec4">`+secHead(s.num,s.titulo,s.bajada);
  h+=`<p class="para">${esc(s.intro)}</p>`;
  h+=toolAritmetica();  // ← herramienta
  h+=`<h3 class="blk">${esc(s.cadena.titulo)}</h3><p class="para">${esc(s.cadena.nota)}</p>`+tabla(s.cadena.headers,s.cadena.filas,{moneyCols:[1]});
  h+=`<h3 class="blk">${esc(s.ticketDecide.titulo)}</h3><p class="para">${esc(s.ticketDecide.nota)}</p>`+tabla(s.ticketDecide.headers,s.ticketDecide.filas,{verdictCol:4,moneyCols:[0,1,3]});
  h+=`<h3 class="blk">${esc(s.escenarioMes3.titulo)}</h3><p class="para">${esc(s.escenarioMes3.nota)}</p>`+tabla(s.escenarioMes3.headers,s.escenarioMes3.filas);
  h+=callout('',s.escenarioMes3.lectura.titulo,`<p>${esc(s.escenarioMes3.lectura.texto)}</p>`);
  h+=`<h3 class="blk">${esc(s.ventasSetup.titulo)}</h3><p class="para">${esc(s.ventasSetup.nota)}</p>`+tabla(s.ventasSetup.headers,s.ventasSetup.filas,{moneyCols:[0]});
  h+=`<h3 class="blk">${esc(s.sensibilidad.titulo)}</h3><p class="para">${esc(s.sensibilidad.nota)}</p>`+tabla(s.sensibilidad.headers,s.sensibilidad.filas,{moneyCols:[1]});
  h+=`</section>`; html+=h;
})();

/* ===== SECCIÓN 5 ===== */
(()=>{const s=D.sec5;
  let h=`<section class="section" id="sec5">`+secHead(s.num,s.titulo,s.bajada);
  // Tier 1
  const t1=s.tier1;
  h+=`<div class="tier"><div class="tier-head t1"><div class="tier-tag">${esc(t1.etiqueta)}</div>
    <div class="tier-name">${esc(t1.nombre)}</div>
    <div class="tier-price">${esc(t1.precio)}</div><div class="tier-cond">${esc(t1.condiciones)}</div>
    <div class="tier-para">${esc(t1.para)}</div></div>
    <div class="tier-body"><div class="cols">
      <div><h4>${esc(t1.instalacion.titulo)}</h4>${listaUL(t1.instalacion.items)}</div>
      <div><h4>${esc(t1.operacion.titulo)}</h4>${listaUL(t1.operacion.items)}</div>
    </div>${callout('',t1.dondeTermina.titulo,`<p>${esc(t1.dondeTermina.texto)}</p>`)}</div></div>`;
  // Tier 2
  const t2=s.tier2;
  h+=`<div class="tier"><div class="tier-head t2"><div class="tier-tag">${esc(t2.etiqueta)}</div>
    <div class="tier-name">${esc(t2.nombre)}</div>
    <div class="tier-price">${esc(t2.precio)}</div><div class="tier-cond">${esc(t2.condiciones)}</div>
    <div class="tier-para">${esc(t2.para)}</div></div>
    <div class="tier-body"><h4>${esc(t2.incluye.titulo)}</h4>${listaUL(t2.incluye.items)}
    ${callout('',t2.ventasAtribuibles.titulo,`<p>${esc(t2.ventasAtribuibles.texto)}</p><p style="margin-top:8px;font-weight:600;color:var(--text)">${esc(t2.ventasAtribuibles.condicion)}</p>`)}</div></div>`;
  // Módulo de cierre
  const m=s.moduloCierre;
  h+=`<h3 class="blk">${esc(m.titulo)}</h3><p class="para">${esc(m.bajada)}</p>`+tabla(m.tabla.headers,m.tabla.filas);
  h+=`<div class="grid2"><div class="card"><h4 style="font-size:11.5px;letter-spacing:.05em;color:var(--text-dim);font-weight:650;margin-bottom:8px">${esc(m.queIncluye.titulo)}</h4>${listaUL(m.queIncluye.items)}</div>
    <div class="card">${callout('q',m.argumento.titulo,`<p style="font-style:italic">${esc(m.argumento.texto)}</p><p style="margin-top:8px">${esc(m.argumento.cierre)}</p>`).replace('margin:14px 0','margin:0')}</div></div>`;
  // Tier 3
  const t3=s.tier3;
  h+=`<div class="tier"><div class="tier-head t3"><div class="tier-tag">${esc(t3.etiqueta)}</div>
    <div class="tier-name">${esc(t3.nombre)}</div>
    <div class="tier-price">${esc(t3.precio)} ${cflag('c1')}</div><div class="tier-cond">${esc(t3.condiciones)}</div>
    <div class="tier-para">${esc(t3.para)}</div></div>
    <div class="tier-body">${tabla(t3.tablaModulos.headers,t3.tablaModulos.filas,{moneyCols:[2,3]})}
    <h3 class="blk" style="margin-top:16px">${esc(t3.tresUsos.titulo)}</h3>${listaOL(t3.tresUsos.items)}
    ${callout('warn','',`<p>${esc(t3.regla)}</p>`)}</div></div>`;
  h+=`</section>`; html+=h;
})();

/* ===== SECCIÓN 6 — Hoja de precios (renderizada desde PRECIOS) ===== */
(()=>{const s=D.sec6;
  let h=`<section class="section" id="sec6">`+secHead(s.num,s.titulo,s.bajada);
  h+=buildSec6();
  h+=`<h3 class="blk">${esc(s.reglas.titulo)}</h3>`+listaOL(s.reglas.items);
  h+=`</section>`; html+=h;
})();
function buildSec6(){
  const s=D.sec6, f=s.tabla.filas;
  // Filas 0-5 se generan desde PRECIOS; 6-15 se toman literales de data.js
  const t1=P.tier1,t2=P.tier2,t3=P.tier3,mc=P.moduloCierre,u=P.umbrales;
  const gen=[
    ['Setup (pago único)', `${fmt(t3.setupMin)} – ${fmt(t3.setupMax)} ${cflag('c1')}`, fmt(t1.setup), fmt(t2.setup)],
    ['Fee mensual', `${fmt(t3.feeMin)} – ${fmt(t3.feeMax)}`, fmt(t1.feeMensual), fmt(t2.feeMensual)],
    ['% sobre ventas atribuibles', 'No', 'No', `${t2.pctVentas}% (desde mes 2)`],
    ['Con Módulo de Cierre', `+$${mc.feeExtra} + ${mc.pctTier3}%`, `+$${mc.feeExtra} + ${mc.pctTier1}%`,
       `+$${mc.feeExtra} + ${mc.pctExtraT2}% = ${fmt(t2.feeMensual+mc.feeExtra)}/mes + ${t2.pctVentas+mc.pctExtraT2}%`],
    ['Ticket mínimo del cliente', fmt(u.ticketMinTier3), fmt(u.ticketMinTier12), fmt(u.ticketMinTier12)],
    ['Presupuesto de pauta mínimo', `${fmt(u.pisoPautaTier3)} / mes`, `1 ticket, piso ${fmt(u.pisoPauta)} / mes`, `1 ticket, piso ${fmt(u.pisoPauta)} / mes`]
  ];
  // filas literales restantes (índices 6..15) con marcas de conflicto en facturación Tier 2
  const rest=f.slice(6).map(row=>{
    let r=row.slice();
    if(r[0]==='Facturación nuestra mes 1'){ r[3]=r[3]+' '+cflag('c2'); r[1]=r[1]+' '+cflag('c4'); }
    if(r[0].startsWith('Facturación nuestra mes 3')){ r[3]=r[3]+' '+cflag('c3'); }
    return r;
  });
  const filas=gen.concat(rest);
  // construir tabla con money highlight en columnas 1,2,3 salvo filas de features
  const th=s.tabla.headers.map(h=>`<th>${esc(h)}</th>`).join('');
  const body=filas.map(row=>{
    const tds=row.map((c,i)=>{
      const isMoney = i>0 && /\$|\d+%|piso/.test(String(c));
      const cls = i===0 ? '' : (isMoney?' class="money"':'');
      // permitir HTML de cflag
      const val = /class="cflag"/.test(String(c)) ? c : cellFmt(c);
      return `<td${cls}>${val}</td>`;
    }).join('');
    return `<tr>${tds}</tr>`;
  }).join('');
  return `<div class="tbl-wrap tbl-sticky"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}

const A={ticket:P.aritmetica.ticketDefault,pres:P.aritmetica.presupuestoDefault,cpa:P.aritmetica.costoPorAgendaDefault,
         show:Math.round(P.aritmetica.showRateDefault*100),cierre:Math.round(P.aritmetica.cierreDefault*100)};
function calcArit(){
  const tier=$('#aTier').value, mod=$('#aMod').checked;
  const show=A.show/100, cierre=A.cierre/100;
  const agendas=Math.floor(A.pres/A.cpa);
  const llamadas=Math.floor(agendas*show);
  const ventas=Math.floor(llamadas*cierre);
  const facturacion=ventas*A.ticket;
  let fee,pct,setup;
  if(tier==='tier1'){fee=P.tier1.feeMensual;pct=0;setup=P.tier1.setup;}
  else if(tier==='tier2'){fee=P.tier2.feeMensual;pct=P.tier2.pctVentas;setup=P.tier2.setup;}
  else {fee=P.tier3.feeMax;pct=0;setup=P.tier3.setupMax;}
  if(mod){fee+=P.moduloCierre.feeExtra;
    if(tier==='tier2')pct+=P.moduloCierre.pctExtraT2;
    else if(tier==='tier1')pct=P.moduloCierre.pctTier1;
    else pct=P.moduloCierre.pctTier3;}
  const pctMonto=Math.round(facturacion*pct/100);
  const neto=facturacion-A.pres-fee-pctMonto;
  const invTotal=A.pres+fee+pctMonto;
  const roi=invTotal>0?facturacion/invTotal:0;
  const facturamos=fee+pctMonto;
  const cpv=(show*cierre)>0?A.cpa/(show*cierre):Infinity;
  const roas=cpv>0&&isFinite(cpv)?A.ticket/cpv:0;
  const ventasPaga=A.ticket>0?Math.ceil(setup/A.ticket):0;
  return {agendas,llamadas,ventas,facturacion,pres:A.pres,fee,pct,pctMonto,neto,roi,facturamos,cpv,roas,setup,ventasPaga};
}
function renderArit(){

  $('#lTicket').textContent=fmt(A.ticket); $('#lPres').textContent=fmt(A.pres);

  $('#rTicket').value=A.ticket; $('#nTicket').value=A.ticket;
  $('#rPres').value=A.pres; $('#nPres').value=A.pres;

  $('#rShow').value=A.show; $('#nShow').value=A.show;

    row('Neto para el cliente',fmt(r.neto),'total')+

const Q={}; // qi -> {oi, sf}
function renderQual(){
  const qs=D.sec10.formulario.preguntas;
  const answered=Object.keys(Q).length;
  // marcar botones
  $$('#toolQual .opt').forEach(b=>{
    const qi=b.dataset.q, oi=b.dataset.o;
    const sel=Q[qi]&&String(Q[qi].oi)===oi;
    b.className='opt'+(sel?' sel '+(b.dataset.sf||''):'');
  });
  const res=$('#qualResult');
  if(answered<qs.length){
    res.innerHTML=`<div class="qr-tier" style="text-align:center;color:var(--text-dim)">Respondé las ${qs.length} preguntas — ${answered}/${qs.length} completadas.</div>`;
    return;
  }
  // evaluar
  let rojo=false,ambar=false;
  const razones=[];
  qs.forEach((q,qi)=>{
    const a=Q[qi]; if(!a)return;
    const sf=a.sf;
    if(sf==='rojo'){rojo=true; razones.push({t:'rojo',q:q,label:q.opciones[a.oi].label});}
    else if(sf==='amarillo'){ambar=true; razones.push({t:'amarillo',q:q,label:q.opciones[a.oi].label});}
  });
  const sem = rojo?'rojo':(ambar?'amarillo':'verde');
  // tier
  const q1=Q[0].oi, q6=Q[5].oi;
  const ticketBandTier3 = (q1===2);         // $900-1,499
  const presBandTier3   = (q6===1);         // $1,000-1,499
  let tier;
  if(sem==='rojo') tier='Ninguno — se descalifica';
  else if(sem==='verde') tier='Tier 2 con Módulo de Cierre';
  else tier = (ticketBandTier3||presBandTier3) ? 'Tier 3' : 'Tier 2 con Módulo de Cierre (agendar con decisor presente / ajustar escalado)';

  const cfg={verde:{e:'🟢',c:'sf-sano',t:'VERDE',ac:D.sec10.formulario.semaforoFinal.filas[0][2]},
             amarillo:{e:'🟡',c:'sf-limite',t:'AMARILLO',ac:D.sec10.formulario.semaforoFinal.filas[1][2]},
             rojo:{e:'🔴',c:'sf-inviable',t:'ROJO',ac:D.sec10.formulario.semaforoFinal.filas[2][2]}}[sem];
  let h=`<div class="qr-banner ${cfg.c}"><div class="big">${cfg.e}</div><div class="rt"><strong>${cfg.t}</strong><span style="font-size:12.5px;color:var(--text-muted)">${esc(cfg.ac)}</span></div></div>`;
  h+=`<div class="qr-tier"><b>Tier recomendado:</b> ${esc(tier)}</div>`;
  // descalificadores / flags activados
  if(razones.length){
    h+=`<div class="qr-list"><div style="font-size:11.5px;color:var(--text-dim);font-weight:650;text-transform:uppercase;letter-spacing:.04em;margin:6px 0 4px">Qué se activó y por qué</div>`;
    razones.forEach(r=>{
      const chip=r.t==='rojo'?'<span class="chip r dot">rojo</span>':'<span class="chip a dot">amarillo</span>';
      h+=`<div class="qri">${chip}<div><b style="color:var(--text)">${esc(r.q.texto)}</b> → "${esc(r.label)}"<br><span style="color:var(--text-dim);font-size:12px">${esc(r.q.regla)}</span></div></div>`;
    });
    h+=`</div>`;
  }
  // texto amable si rojo
  if(sem==='rojo'){
    h+=`<div class="copy-area"><div class="copy-txt" id="qualAmable">${esc(D.sec3.descalificacionAmable.texto)}</div>
        <button class="btn primary copy-btn" data-copy="qualAmable">📋 Copiar descalificación</button></div>`;
  }
  res.innerHTML=h;
  bindCopy(res);
}

/* =========================================================================
   INTERACCIONES / EVENTOS
   ========================================================================= */
// --- Aritmética wiring ---
function bindRangeNum(rId,nId,key,state,after){
  const r=$(rId),n=$(nId);
  const set=v=>{v=clamp(v,+r.min,+r.max);state[key]=v;after();};
  r.addEventListener('input',()=>set(+r.value));
  n.addEventListener('input',()=>{if(n.value!=='')set(+n.value)});
  n.addEventListener('blur',()=>{if(n.value==='')set(state[key]);});
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
bindRangeNum('#rTicket','#nTicket','ticket',A,renderArit);
bindRangeNum('#rPres','#nPres','pres',A,renderArit);
bindRangeNum('#rCpa','#nCpa','cpa',A,renderArit);
bindRangeNum('#rShow','#nShow','show',A,renderArit);
bindRangeNum('#rCierre','#nCierre','cierre',A,renderArit);
$('#aTier').addEventListener('change',renderArit);
$('#aMod').addEventListener('change',renderArit);
$('#aritNuestroToggle').addEventListener('click',()=>$('#aritNuestroBox').classList.toggle('collapsed'));
$('#aritModo').addEventListener('click',e=>{
  const t=$('#toolArit');t.classList.toggle('presenta');
  const on=t.classList.contains('presenta');
  e.currentTarget.classList.toggle('on',on);
  e.currentTarget.textContent=on?'🖥 Salir de presentación':'🖥 Modo presentación';
  if(on)$('#aritNuestroBox').classList.add('collapsed');
});

// --- Cualificador wiring ---
$('#toolQual').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b)return;
  Q[b.dataset.q]={oi:+b.dataset.o,sf:b.dataset.sf};

// --- Copiar ---
function bindCopy(scope){
  $$('[data-copy]',scope).forEach(b=>{
    if(b._bound)return; b._bound=true;
    b.addEventListener('click',()=>{
      const txt=$('#'+b.dataset.copy).textContent;
      const done=()=>{const o=b.textContent;b.textContent='✓ Copiado';b.classList.add('on');setTimeout(()=>{b.textContent=o;b.classList.remove('on')},1400);};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));}
      else fallbackCopy(txt,done);
    });
  });
}
function fallbackCopy(txt,cb){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);cb&&cb();}

// --- Acordeón objeciones ---
$('#accObj').addEventListener('click',e=>{
  const head=e.target.closest('.acc-head'); if(!head)return;
  const item=head.closest('.acc-item');
  const body=item.querySelector('.acc-body');
  const open=item.classList.toggle('open');
  head.setAttribute('aria-expanded',open);
  body.style.maxHeight=open?body.scrollHeight+'px':'0';
});

$('#checklist').addEventListener('click',e=>toggleChk(e.target.closest('.check-item')));

/* =========================================================================
   NAV activo (scroll spy) + móvil
   ========================================================================= */
const navLinks=$$('#nav a');
const secEls=D.nav.map(s=>document.getElementById(s.id));
const spy=new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(en.isIntersecting){
      const id=en.target.id;
      navLinks.forEach(a=>a.classList.toggle('active',a.dataset.sec===id));
    }
  });
},{rootMargin:'-20% 0px -70% 0px',threshold:0});
secEls.forEach(el=>el&&spy.observe(el));

// móvil sidebar
const sb=$('#sidebar'),bd=$('#backdrop');
function openSb(o){sb.classList.toggle('open',o);bd.classList.toggle('show',o);}
$('#burger').addEventListener('click',()=>openSb(!sb.classList.contains('open')));

/* =========================================================================
   BUSCADOR GLOBAL
   ========================================================================= */
const INDEX=buildIndex();
function buildIndex(){
  const idx=[];
  function add(secId,secTitulo,titulo,texto){idx.push({secId,secTitulo,titulo,texto:String(texto)});}
  function walk(secId,secTitulo,node,label){
    if(node==null)return;
    if(typeof node==='string'){ if(node.trim())add(secId,secTitulo,label,node); return; }
    if(Array.isArray(node)){node.forEach(n=>walk(secId,secTitulo,n,label));return;}
    if(typeof node==='object'){
      const lbl=node.titulo||node.objecion||node.texto||label;
      for(const k in node){ if(k==='num')continue; walk(secId,secTitulo,node[k], (node.titulo||node.objecion)?lbl:label); }
    }
  }
  D.nav.forEach(s=>{ walk(s.id, s.num+' · '+s.titulo, D[s.id], s.titulo); });
  return idx;
}
const searchInput=$('#search'), searchResults=$('#searchResults');
let srHL=-1, srItems=[];
searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim().toLowerCase();
  if(q.length<2){searchResults.classList.remove('show');searchResults.innerHTML='';return;}
  const seen=new Set(); const matches=[];
  for(const it of INDEX){
    const pos=it.texto.toLowerCase().indexOf(q);
    if(pos>=0){
      const key=it.secId+'|'+it.texto.slice(0,40);
      if(seen.has(key))continue; seen.add(key);
      matches.push({...it,pos});
      if(matches.length>=24)break;
    }
  }
  srItems=matches; srHL=-1;
  if(!matches.length){searchResults.innerHTML=`<div class="sr-empty">Sin resultados para “${esc(q)}”.</div>`;searchResults.classList.add('show');return;}
  searchResults.innerHTML=matches.map((m,i)=>{
    const t=m.texto; const s=Math.max(0,m.pos-30); const snip=(s>0?'…':'')+t.slice(s,m.pos+q.length+50)+'…';
    const hl=esc(snip).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
    return `<div class="sr-item" data-i="${i}" data-sec="${m.secId}"><div class="sr-sec">${esc(m.secTitulo)}</div><div class="sr-txt">${hl}</div></div>`;
  }).join('');
  searchResults.classList.add('show');
});
searchResults.addEventListener('click',e=>{const it=e.target.closest('.sr-item');if(it)goToSec(it.dataset.sec);});
searchInput.addEventListener('keydown',e=>{
  if(!searchResults.classList.contains('show'))return;
  const items=$$('.sr-item',searchResults);
  if(e.key==='ArrowDown'){e.preventDefault();srHL=Math.min(srHL+1,items.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();srHL=Math.max(srHL-1,0);}
  else if(e.key==='Enter'){e.preventDefault();const t=items[srHL]||items[0];if(t)goToSec(t.dataset.sec);return;}
  else if(e.key==='Escape'){searchResults.classList.remove('show');searchInput.blur();return;}
  items.forEach((x,i)=>x.classList.toggle('hl',i===srHL));
  if(items[srHL])items[srHL].scrollIntoView({block:'nearest'});
});
document.addEventListener('click',e=>{if(!e.target.closest('.sb-search'))searchResults.classList.remove('show');});
function goToSec(id){
  searchResults.classList.remove('show'); searchInput.value=''; openSb(false);
  const el=document.getElementById(id);
  if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}
}

/* =========================================================================
   ATAJOS DE TECLADO
   ========================================================================= */
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key==='/'&&!typing){e.preventDefault();searchInput.focus();}
  else if((e.key==='p'||e.key==='P')&&!typing){e.preventDefault();goToSec('sec6');}
});
