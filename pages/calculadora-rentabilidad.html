<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora - Tu Ruta Financiera</title>
    <style>
        :root {
            /* PALETA OFICIAL - TU RUTA FINANCIERA */
            --bg-dark: #060807; /* Negro verdoso - Fondo base */
            --card-bg: #0a0e0c; /* Ligeramente más claro para las tarjetas */
            --border-color: #1B7A34; /* Verde profundo - Degradados y glow */
            --text-main: #EFF6F0; /* Blanco verdoso - Titulares y texto */
            --text-muted: #8ba394; /* Variante apagada para etiquetas */
            
            --accent: #39FF60; /* Verde neón - Acentos, bordes, resplandor */
            --accent-glow: rgba(57, 255, 96, 0.15);
            
            --btn-action: #C42828; /* Rojo acción - Solo botones y urgencia */
            --btn-action-hover: #9e1f1f;
            
            --warning: #eab308; /* Alertas medias */
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; overflow-x: hidden; }
        
        .app-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius);
            border: 1px solid rgba(27, 122, 52, 0.5); /* Borde Verde profundo */
            /* Glow de fondo usando Verde Profundo */
            box-shadow: 0 0 50px rgba(27, 122, 52, 0.15), 0 0 0 1px rgba(57, 255, 96, 0.05);
            position: relative;
            overflow: hidden;
            min-height: 500px;
        }

        /* Sistema de Vistas Animadas */
        .screen { display: none; width: 100%; }
        .screen.active { display: block; animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Pantalla Bienvenida */
        .welcome-content { padding: 40px 24px; text-align: center; display: flex; flex-direction: column; justify-content: center; min-height: 500px; 
            background: radial-gradient(circle at 50% 0%, rgba(27, 122, 52, 0.2) 0%, transparent 60%);
        }
        
        .icon-pulse { width: 64px; height: 64px; background: rgba(57, 255, 96, 0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; border: 1px solid rgba(57, 255, 96, 0.4); animation: pulse 2s infinite; }
        .icon-pulse svg { width: 32px; height: 32px; color: var(--accent); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-glow); } 70% { box-shadow: 0 0 0 15px rgba(57, 255, 96, 0); } 100% { box-shadow: 0 0 0 0 rgba(57, 255, 96, 0); } }
        
        /* Tipografía Branding */
        .welcome-content h1 { font-size: 1.6rem; margin-bottom: 8px; font-weight: 800; letter-spacing: -0.025em; text-transform: uppercase; text-shadow: 0 0 15px rgba(57, 255, 96, 0.2); }
        .welcome-content p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 40px; }
        
        .input-premium { width: 100%; padding: 18px; background: rgba(6, 8, 7, 0.8); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 1.1rem; text-align: center; outline: none; transition: all 0.3s; margin-bottom: 24px; }
        .input-premium:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
        
        /* Botón Rojo Acción */
        .btn-primary { width: 100%; padding: 18px; background: var(--btn-action); color: #fff; font-size: 1.05rem; font-weight: 700; text-transform: uppercase; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px rgba(196, 40, 40, 0.3); letter-spacing: 0.05em; }
        .btn-primary:hover { background: var(--btn-action-hover); transform: translateY(-2px); }
        .btn-primary:active { transform: translateY(0); }

        /* Pantalla Calculadora */
        .header { background: radial-gradient(ellipse at top, rgba(27, 122, 52, 0.25) 0%, rgba(10, 14, 12, 1) 100%); padding: 24px 20px; border-bottom: 1px solid rgba(27, 122, 52, 0.4); text-align: center; }
        .header h2 { font-size: 1.3rem; font-weight: 800; text-transform: uppercase; letter-spacing: -0.025em; text-shadow: 0 0 10px rgba(57, 255, 96, 0.2); }
        .header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 6px; }
        .user-highlight { color: var(--text-main); font-weight: 700; }
        .reset-btn { color: var(--btn-action); font-size: 0.75rem; text-decoration: none; margin-left: 8px; cursor: pointer; padding: 4px; font-weight: 600; text-transform: uppercase; }

        .content { padding: 20px; }

        .form-group { margin-bottom: 24px; animation: slideUpFade 0.5s ease backwards; }
        .form-group:nth-child(2) { animation-delay: 0.1s; }
        .form-group:nth-child(3) { animation-delay: 0.2s; }
        
        .form-group label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 0.05em; }

        .amount-display { position: relative; display: flex; align-items: center; background: rgba(6, 8, 7, 0.8); border: 1px solid var(--border-color); border-radius: 8px; padding: 4px; transition: border-color 0.2s; }
        .amount-display:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
        .currency-symbol { position: absolute; left: 16px; font-size: 1.5rem; font-weight: 600; color: var(--accent); }
        input[type="number"] { width: 100%; background: transparent; border: none; color: var(--text-main); font-size: 1.75rem; font-weight: 700; padding: 14px 14px 14px 44px; outline: none; -moz-appearance: textfield; }
        
        input[type="range"] { width: 100%; margin-top: 20px; appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(27, 122, 52, 0.4); border-radius: 4px; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; height: 20px; width: 20px; border-radius: 50%; background: var(--accent); cursor: pointer; margin-top: -8px; box-shadow: 0 0 12px rgba(57,255,96,0.6); transition: transform 0.1s; }
        
        select { width: 100%; padding: 16px; background: rgba(6, 8, 7, 0.8); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; font-size: 0.95rem; font-weight: 600; appearance: none; outline: none; cursor: pointer; transition: border-color 0.2s; }
        select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
        .select-wrapper { position: relative; }
        .select-wrapper::after { content: "▼"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 0.7rem; color: var(--accent); pointer-events: none; }

        .hybrid-models { display: none; gap: 12px; margin-top: 12px; }
        .hybrid-models .select-wrapper { flex: 1; }

        .dashboard { background: rgba(6, 8, 7, 0.5); border-radius: 12px; padding: 20px; border: 1px solid rgba(27, 122, 52, 0.3); margin-top: 32px; animation: slideUpFade 0.6s ease backwards; animation-delay: 0.3s; position: relative; overflow: hidden; }
        .dashboard::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.5; }
        
        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .metric { background: rgba(10, 14, 12, 0.8); padding: 16px; border-radius: 8px; border: 1px solid rgba(27, 122, 52, 0.2); display: flex; flex-direction: column; justify-content: center; }
        .metric-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em; }
        .metric-value { font-size: 1.35rem; font-weight: 800; color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }
        .metric-value.total { color: var(--text-main); font-size: 1.2rem; text-shadow: none; }
        
        .risk-bar-container { width: 100%; height: 4px; background: rgba(27, 122, 52, 0.3); border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .risk-bar { height: 100%; background: var(--warning); border-radius: 4px; transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s; }
        .risk-label { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-top: 20px; text-transform: uppercase; letter-spacing: 0.05em; }

        /* Media Queries Mobile Optimizado */
        @media (max-width: 400px) {
            .metric-grid { grid-template-columns: 1fr; }
            .metric-value { font-size: 1.5rem; }
            .hybrid-models { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Pantalla 1: Bienvenida -->
    <div id="welcomeScreen" class="screen">
        <div class="welcome-content">
            <div class="icon-pulse">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h1>Tu Ruta Financiera</h1>
            <p>Masterclass en vivo • Simulador OPM</p>
            
            <label style="text-align: left; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; display: block; letter-spacing: 0.05em;">Nombre del Inversor</label>
            <input type="text" id="nameInput" class="input-premium" placeholder="Ej. Juan Pérez" autocomplete="off">
            
            <button id="startBtn" class="btn-primary">Configurar Portafolio</button>
        </div>
    </div>

    <!-- Pantalla 2: Calculadora Principal -->
    <div id="calcScreen" class="screen">
        <div class="header">
            <h2>Tu Ruta Financiera</h2>
            <p>Inversor: <span id="userNameDisplay" class="user-highlight"></span> <span id="resetBtn" class="reset-btn">(Cambiar)</span></p>
        </div>

        <div class="content">
            <!-- Input de Capital -->
            <div class="form-group">
                <label>Línea de Crédito Aprobada</label>
                <div class="amount-display">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="capitalInput" min="1000" max="100000" step="1000" value="30000">
                </div>
                <input type="range" id="capitalRange" min="1000" max="100000" step="1000" value="30000">
            </div>

            <!-- Perfil de Riesgo -->
            <div class="form-group">
                <label>Escenario Estratégico</label>
                <div class="select-wrapper">
                    <select id="scenarioSelect">
                        <option value="conservador">Conservador (Flujo Estable)</option>
                        <option value="medio">Medio (Crecimiento Sostenido)</option>
                        <option value="agresivo">Agresivo (Alta Rentabilidad)</option>
                        <option value="hibrido">Híbrido (Split 50/50)</option>
                    </select>
                </div>
            </div>

            <!-- Vehículo de Inversión (Simple) -->
            <div class="form-group" id="singleModelGroup">
                <label>Vehículo de Inversión</label>
                <div class="select-wrapper">
                    <select id="assetSelect"></select>
                </div>
            </div>

            <!-- Vehículo de Inversión (Híbrido) -->
            <div class="form-group hybrid-models" id="hybridModelGroup">
                <div style="width: 100%">
                    <label>Combinación (50% - 50%)</label>
                    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <div class="select-wrapper" style="flex: 1; min-width: 140px;">
                            <select id="hybridAsset1"></select>
                        </div>
                        <div class="select-wrapper" style="flex: 1; min-width: 140px;">
                            <select id="hybridAsset2"></select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Dashboard de Resultados -->
            <div class="dashboard">
                <div class="metric-grid">
                    <div class="metric">
                        <div class="metric-label">Retorno Mensual</div>
                        <div class="metric-value" id="resMonthly">+$0</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Retorno Anual</div>
                        <div class="metric-value" id="resAnnual">+$0</div>
                    </div>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px;">
                    <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">Capital + Beneficio (Mes 12)</span>
                    <span class="metric-value total" id="resTotal">$0</span>
                </div>

                <div class="risk-label">
                    <span>Índice de Volatilidad (Riesgo)</span>
                    <span id="resRiskText" style="color: var(--warning);">0%</span>
                </div>
                <div class="risk-bar-container">
                    <div class="risk-bar" id="resRiskBar" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Variables de Vistas y Usuario
    const welcomeScreen = document.getElementById('welcomeScreen');
    const calcScreen = document.getElementById('calcScreen');
    const nameInput = document.getElementById('nameInput');
    const startBtn = document.getElementById('startBtn');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const resetBtn = document.getElementById('resetBtn');

    // Base de datos de activos (Riesgos reales)
    const db = {
        conservador: [
            { id: 'bonos', name: 'Bonos / T-Bills', roi: 0.05, risk: 0.02 },
            { id: 'compuesto', name: 'Interés Compuesto', roi: 0.08, risk: 0.08 }
        ],
        medio: [
            { id: 'bienes', name: 'Bienes Raíces', roi: 0.12, risk: 0.1 },
            { id: 'oro', name: 'Oro (ETF)', roi: 0.10, risk: 0.12 },
            { id: 'plata', name: 'Plata Física', roi: 0.14, risk: 0.18 }
        ],
        agresivo: [
            { id: 'trading', name: 'Trading Institucional', roi: 0.24, risk: 0.2 },
            { id: 'cripto', name: 'Cripto Bluechips', roi: 0.30, risk: 0.35 }
        ]
    };
    const allAssets = [...db.conservador, ...db.medio, ...db.agresivo];

    // Elementos DOM Calculadora
    const inputNum = document.getElementById('capitalInput');
    const inputRange = document.getElementById('capitalRange');
    const scenario = document.getElementById('scenarioSelect');
    const singleGroup = document.getElementById('singleModelGroup');
    const hybridGroup = document.getElementById('hybridModelGroup');
    const assetSelect = document.getElementById('assetSelect');
    const hybrid1 = document.getElementById('hybridAsset1');
    const hybrid2 = document.getElementById('hybridAsset2');
    const uiMonthly = document.getElementById('resMonthly');
    const uiAnnual = document.getElementById('resAnnual');
    const uiTotal = document.getElementById('resTotal');
    const uiRiskText = document.getElementById('resRiskText');
    const uiRiskBar = document.getElementById('resRiskBar');

    const formatMoney = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);
    const formatPercent = (val) => (val * 100).toFixed(1) + '%';

    // --- LÓGICA DE USUARIO Y PANTALLAS ---
    function initApp() {
        const savedName = localStorage.getItem('investorName');
        if (savedName) {
            userNameDisplay.textContent = savedName;
            showScreen(calcScreen);
            handleScenarioChange(); // Init calc
        } else {
            showScreen(welcomeScreen);
            nameInput.focus();
        }
    }

    function showScreen(screenEl) {
        welcomeScreen.classList.remove('active');
        calcScreen.classList.remove('active');
        
        setTimeout(() => {
            screenEl.classList.add('active');
        }, 10);
    }

    function saveUser() {
        const name = nameInput.value.trim();
        if (name.length > 0) {
            localStorage.setItem('investorName', name);
            userNameDisplay.textContent = name;
            showScreen(calcScreen);
            handleScenarioChange();
        } else {
            nameInput.style.borderColor = 'var(--btn-action)';
            setTimeout(() => nameInput.style.borderColor = 'var(--border-color)', 1000);
        }
    }

    startBtn.addEventListener('click', saveUser);
    nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveUser(); });

    resetBtn.addEventListener('click', () => {
        localStorage.removeItem('investorName');
        nameInput.value = '';
        showScreen(welcomeScreen);
    });

    // --- LÓGICA DE CALCULADORA ---
    const syncInputs = (e) => {
        let val = parseInt(e.target.value);
        if (val > 100000) val = 100000;
        if (val < 0 || isNaN(val)) val = 1000;
        inputNum.value = val;
        inputRange.value = val;
        calculate();
    };

    inputNum.addEventListener('input', syncInputs);
    inputRange.addEventListener('input', syncInputs);

    const populateSelect = (selectElement, optionsArray) => {
        selectElement.innerHTML = '';
        optionsArray.forEach(item => {
            let opt = document.createElement('option');
            opt.value = item.id;
            opt.textContent = item.name;
            opt.dataset.roi = item.roi;
            opt.dataset.risk = item.risk;
            selectElement.appendChild(opt);
        });
    };

    const handleScenarioChange = () => {
        const mode = scenario.value;
        if (mode === 'hibrido') {
            singleGroup.style.display = 'none';
            hybridGroup.style.display = 'block';
            populateSelect(hybrid1, allAssets);
            populateSelect(hybrid2, allAssets);
            hybrid1.selectedIndex = 0; // Bonos
            hybrid2.selectedIndex = 6; // Cripto
        } else {
            singleGroup.style.display = 'block';
            hybridGroup.style.display = 'none';
            populateSelect(assetSelect, db[mode]);
        }
        calculate();
    };

    scenario.addEventListener('change', handleScenarioChange);
    assetSelect.addEventListener('change', calculate);
    hybrid1.addEventListener('change', calculate);
    hybrid2.addEventListener('change', calculate);

    function calculate() {
        const capital = parseInt(inputNum.value) || 0;
        const mode = scenario.value;
        let roiAnual = 0;
        let riskLvl = 0;

        if (mode === 'hibrido') {
            const opt1 = hybrid1.options[hybrid1.selectedIndex];
            const opt2 = hybrid2.options[hybrid2.selectedIndex];
            const cap1 = capital * 0.5;
            const cap2 = capital * 0.5;
            roiAnual = (cap1 * parseFloat(opt1.dataset.roi)) + (cap2 * parseFloat(opt2.dataset.roi));
            riskLvl = (parseFloat(opt1.dataset.risk) + parseFloat(opt2.dataset.risk)) / 2;
        } else {
            const opt = assetSelect.options[assetSelect.selectedIndex];
            if(!opt) return;
            roiAnual = capital * parseFloat(opt.dataset.roi);
            riskLvl = parseFloat(opt.dataset.risk);
        }

        const roiMensual = roiAnual / 12;
        
        uiMonthly.innerText = '+' + formatMoney(roiMensual);
        uiAnnual.innerText = '+' + formatMoney(roiAnual);
        uiTotal.innerText = formatMoney(capital + roiAnual);
        uiRiskText.innerText = formatPercent(riskLvl);
        
        uiRiskBar.style.width = (riskLvl * 100) + '%';
        
        // Colores de riesgo actualizados a la guía gráfica
        if (riskLvl < 0.05) { 
            uiRiskBar.style.background = 'var(--accent)'; 
            uiRiskText.style.color = 'var(--accent)'; 
            uiRiskText.style.textShadow = '0 0 10px var(--accent-glow)';
        }
        else if (riskLvl <= 0.15) { 
            uiRiskBar.style.background = 'var(--warning)'; 
            uiRiskText.style.color = 'var(--warning)'; 
            uiRiskText.style.textShadow = 'none';
        }
        else { 
            uiRiskBar.style.background = 'var(--btn-action)'; 
            uiRiskText.style.color = 'var(--btn-action)'; 
            uiRiskText.style.textShadow = 'none';
        }
    }

    // Arrancar aplicación
    initApp();
</script>

</body>
</html>
