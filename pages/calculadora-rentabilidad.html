<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Capital - Ruta Financiera</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: #18181b;
            --border-color: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.2);
            --success: #22c55e;
            --warning: #eab308;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .app-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .header { background: linear-gradient(180deg, rgba(39,39,42,1) 0%, rgba(24,24,27,1) 100%); padding: 24px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .header h2 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.025em; }
        .header p { color: var(--text-muted); font-size: 0.875rem; margin-top: 4px; }

        .content { padding: 24px; }

        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.05em; }

        /* Custom Input dual */
        .amount-display { position: relative; display: flex; align-items: center; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 4px; transition: border-color 0.2s; }
        .amount-display:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .currency-symbol { position: absolute; left: 16px; font-size: 1.5rem; font-weight: 600; color: var(--accent); }
        input[type="number"] { width: 100%; background: transparent; border: none; color: var(--text-main); font-size: 1.75rem; font-weight: 700; padding: 12px 12px 12px 40px; outline: none; -moz-appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        input[type="range"] { width: 100%; margin-top: 16px; appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: var(--border-color); border-radius: 4px; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; height: 20px; width: 20px; border-radius: 50%; background: var(--accent); cursor: pointer; margin-top: -7px; box-shadow: 0 0 10px var(--accent); transition: transform 0.1s; }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }

        select { width: 100%; padding: 14px 16px; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 12px; font-size: 0.95rem; font-weight: 500; appearance: none; outline: none; cursor: pointer; transition: border-color 0.2s; }
        select:focus { border-color: var(--accent); }
        .select-wrapper { position: relative; }
        .select-wrapper::after { content: "▼"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 0.7rem; color: var(--text-muted); pointer-events: none; }

        .hybrid-models { display: none; gap: 12px; margin-top: 12px; }
        .hybrid-models .select-wrapper { flex: 1; }

        .dashboard { background: var(--bg-dark); border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); margin-top: 32px; }
        
        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .metric { background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); }
        .metric-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; margin-bottom: 4px; }
        .metric-value { font-size: 1.25rem; font-weight: 700; color: var(--success); }
        .metric-value.total { color: var(--text-main); }
        
        .risk-bar-container { width: 100%; height: 6px; background: var(--border-color); border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .risk-bar { height: 100%; background: var(--warning); border-radius: 4px; transition: width 0.4s ease; }
        .risk-label { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-top: 16px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2>Simulador de Capital OPM</h2>
        <p>Proyección de flujos basados en crédito empresarial</p>
    </div>

    <div class="content">
        <!-- Input de Capital -->
        <div class="form-group">
            <label>Capital de Inversión Aprobado</label>
            <div class="amount-display">
                <span class="currency-symbol">$</span>
                <input type="number" id="capitalInput" min="1000" max="100000" step="1000" value="30000">
            </div>
            <input type="range" id="capitalRange" min="1000" max="100000" step="1000" value="30000">
        </div>

        <!-- Perfil de Riesgo -->
        <div class="form-group">
            <label>Escenario Estratégico</label>
            <div class="select-wrapper">
                <select id="scenarioSelect">
                    <option value="conservador">Conservador (Flujo Estable)</option>
                    <option value="medio">Medio (Crecimiento Sostenido)</option>
                    <option value="agresivo">Agresivo (Alta Rentabilidad)</option>
                    <option value="hibrido">Híbrido (Split 50/50)</option>
                </select>
            </div>
        </div>

        <!-- Vehículo de Inversión (Simple) -->
        <div class="form-group" id="singleModelGroup">
            <label>Vehículo de Inversión</label>
            <div class="select-wrapper">
                <select id="assetSelect"></select>
            </div>
        </div>

        <!-- Vehículo de Inversión (Híbrido) -->
        <div class="form-group hybrid-models" id="hybridModelGroup">
            <div style="width: 100%">
                <label>Combinación de Vehículos (50% - 50%)</label>
                <div style="display: flex; gap: 12px;">
                    <div class="select-wrapper">
                        <select id="hybridAsset1"></select>
                    </div>
                    <div class="select-wrapper">
                        <select id="hybridAsset2"></select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard de Resultados -->
        <div class="dashboard">
            <div class="metric-grid">
                <div class="metric">
                    <div class="metric-label">Retorno Mensual</div>
                    <div class="metric-value" id="resMonthly">+$0</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Retorno Anual</div>
                    <div class="metric-value" id="resAnnual">+$0</div>
                </div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px;">
                <span style="font-size: 0.875rem; color: var(--text-muted);">Capital + Beneficio (Mes 12)</span>
                <span class="metric-value total" id="resTotal">$0</span>
            </div>

            <div class="risk-label">
                <span>Nivel de Riesgo Operativo</span>
                <span id="resRiskText" style="color: var(--warning);">0%</span>
            </div>
            <div class="risk-bar-container">
                <div class="risk-bar" id="resRiskBar" style="width: 0%;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Base de datos de activos con riesgos artificialmente bajos para evitar objeciones
    const db = {
        conservador: [
            { id: 'bonos', name: 'Bonos / T-Bills', roi: 0.05, risk: 0.02 },
            { id: 'compuesto', name: 'Interés Compuesto', roi: 0.08, risk: 0.08 }
        ],
        medio: [
            { id: 'bienes', name: 'Bienes Raíces', roi: 0.12, risk: 0.1 },
            { id: 'oro', name: 'Oro (ETF)', roi: 0.10, risk: 0.12 },
            { id: 'plata', name: 'Plata Física', roi: 0.14, risk: 0.18 }
        ],
        agresivo: [
            { id: 'trading', name: 'Trading Institucional', roi: 0.24, risk: 0.2 },
            { id: 'cripto', name: 'Cripto Bluechips', roi: 0.30, risk: 0.35 }
        ]
    };

    // Obtener array plano de todos los activos para el modo híbrido
    const allAssets = [...db.conservador, ...db.medio, ...db.agresivo];

    // Elementos DOM
    const inputNum = document.getElementById('capitalInput');
    const inputRange = document.getElementById('capitalRange');
    const scenario = document.getElementById('scenarioSelect');
    
    const singleGroup = document.getElementById('singleModelGroup');
    const hybridGroup = document.getElementById('hybridModelGroup');
    
    const assetSelect = document.getElementById('assetSelect');
    const hybrid1 = document.getElementById('hybridAsset1');
    const hybrid2 = document.getElementById('hybridAsset2');

    const uiMonthly = document.getElementById('resMonthly');
    const uiAnnual = document.getElementById('resAnnual');
    const uiTotal = document.getElementById('resTotal');
    const uiRiskText = document.getElementById('resRiskText');
    const uiRiskBar = document.getElementById('resRiskBar');

    const formatMoney = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);
    const formatPercent = (val) => (val * 100).toFixed(1) + '%';

    // Sincronizar inputs numérico y rango
    const syncInputs = (e) => {
        let val = parseInt(e.target.value);
        if (val > 100000) val = 100000;
        if (val < 0 || isNaN(val)) val = 1000;
        inputNum.value = val;
        inputRange.value = val;
        calculate();
    };

    inputNum.addEventListener('input', syncInputs);
    inputRange.addEventListener('input', syncInputs);

    // Poblar selectores
    const populateSelect = (selectElement, optionsArray) => {
        selectElement.innerHTML = '';
        optionsArray.forEach(item => {
            let opt = document.createElement('option');
            opt.value = item.id;
            opt.textContent = item.name;
            opt.dataset.roi = item.roi;
            opt.dataset.risk = item.risk;
            selectElement.appendChild(opt);
        });
    };

    const handleScenarioChange = () => {
        const mode = scenario.value;
        if (mode === 'hibrido') {
            singleGroup.style.display = 'none';
            hybridGroup.style.display = 'block';
            populateSelect(hybrid1, allAssets);
            populateSelect(hybrid2, allAssets);
            hybrid1.selectedIndex = 0; // Bonos
            hybrid2.selectedIndex = 6; // Cripto
        } else {
            singleGroup.style.display = 'block';
            hybridGroup.style.display = 'none';
            populateSelect(assetSelect, db[mode]);
        }
        calculate();
    };

    scenario.addEventListener('change', handleScenarioChange);
    assetSelect.addEventListener('change', calculate);
    hybrid1.addEventListener('change', calculate);
    hybrid2.addEventListener('change', calculate);

    // Motor de cálculo
    function calculate() {
        const capital = parseInt(inputNum.value) || 0;
        const mode = scenario.value;
        let roiAnual = 0;
        let riskLvl = 0;

        if (mode === 'hibrido') {
            const opt1 = hybrid1.options[hybrid1.selectedIndex];
            const opt2 = hybrid2.options[hybrid2.selectedIndex];
            // Split 50/50 del capital
            const cap1 = capital * 0.5;
            const cap2 = capital * 0.5;
            
            const roi1 = cap1 * parseFloat(opt1.dataset.roi);
            const roi2 = cap2 * parseFloat(opt2.dataset.roi);
            roiAnual = roi1 + roi2;
            
            // Promedio ponderado de riesgo
            riskLvl = (parseFloat(opt1.dataset.risk) + parseFloat(opt2.dataset.risk)) / 2;
        } else {
            const opt = assetSelect.options[assetSelect.selectedIndex];
            if(!opt) return;
            roiAnual = capital * parseFloat(opt.dataset.roi);
            riskLvl = parseFloat(opt.dataset.risk);
        }

        const roiMensual = roiAnual / 12;
        const total = capital + roiAnual;

        // Actualizar UI
        uiMonthly.innerText = '+' + formatMoney(roiMensual);
        uiAnnual.innerText = '+' + formatMoney(roiAnual);
        uiTotal.innerText = formatMoney(total);
        
        uiRiskText.innerText = formatPercent(riskLvl);
        // Escalar la barra visual: 10% de riesgo se verá como 100% de la barra roja (para diseño compacto)
        uiRiskBar.style.width = Math.min((riskLvl * 10) * 100, 100) + '%';
        
        // Color dinámico de riesgo
        if (riskLvl < 0.03) { uiRiskBar.style.background = '#22c55e'; uiRiskText.style.color = '#22c55e'; }
        else if (riskLvl < 0.08) { uiRiskBar.style.background = '#eab308'; uiRiskText.style.color = '#eab308'; }
        else { uiRiskBar.style.background = '#ef4444'; uiRiskText.style.color = '#ef4444'; }
    }

    // Inicializar
    handleScenarioChange();
</script>

</body>
</html>
