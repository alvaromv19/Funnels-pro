<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de embudo — EVO LAUNCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
/* =========================================================
   IDENTIDAD DE MARCA - se cambia todo desde aqui
   Cian neon    #00FFFF  acentos, CTA, enlaces, vinetas
   Morado       #7B00FF  identidad secundaria, barras, bordes
   Blanco puro  #FFFFFF  titulares en tema oscuro
   ========================================================= */
:root{
  --cian:          #00FFFF;
  --morado:        #7B00FF;

  /* tema claro (por defecto: videollamada e impresion) */
  --fondo:         #FFFFFF;
  --superficie:    #F5F6FB;
  --texto:         #0B0B12;
  --texto-suave:   #5C6070;
  --borde:         #E3E5EF;
  --acento:        #0093A6;
  --acento-solido: #00FFFF;
  --acento-tinta:  #04141A;
  --secundario:    #7B00FF;
  --vineta:        #7B00FF;
  --sano:          #0E9F6E;
  --alerta:        #B45309;
  --grave:         #DC2626;
  --fila-rota:     #FDF1F1;
  --radio:         12px;
}

[data-tema="oscuro"]{
  --fondo:         #07070D;
  --superficie:    #13131E;
  --texto:         #FFFFFF;
  --texto-suave:   #9AA0B4;
  --borde:         #262637;
  --acento:        #00FFFF;
  --acento-solido: #00FFFF;
  --acento-tinta:  #04141A;
  --secundario:    #8A2BE2;
  --vineta:        #00FFFF;
  --sano:          #34D399;
  --alerta:        #FBBF24;
  --grave:         #FF5A5A;
  --fila-rota:     #2A1218;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fondo);
  color:var(--texto);
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:880px;margin:0 auto;padding:36px 20px 96px}
.vista{display:none}
.vista.activa{display:block}
.oculto{display:none !important}

/* ---------- cabecera, logo y conmutador de tema ---------- */
.cabecera{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:20px;margin-bottom:40px;
}
.identidad{display:flex;flex-direction:column;gap:8px;min-width:0}
.logo{height:56px;width:auto;display:block}
.marca-txt{font-size:14px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--texto)}
.marca-sub{font-size:13px;color:var(--texto-suave)}
.tema-btn{
  display:inline-flex;align-items:center;gap:8px;flex:none;
  padding:8px 14px;font-family:inherit;font-size:13px;font-weight:600;
  color:var(--texto);background:transparent;
  border:1px solid var(--borde);border-radius:999px;cursor:pointer;
}
.tema-btn:hover{border-color:var(--acento);color:var(--acento)}
.tema-btn svg{width:15px;height:15px;flex:none}

/* ---------- tipografia ---------- */
h1{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;color:var(--texto)}
h2{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 14px;color:var(--texto)}
p{margin:0 0 14px}
.suave{color:var(--texto-suave)}
.pequeno{font-size:14px}
.mini{font-size:13px;line-height:1.5;color:var(--texto-suave)}
.texto-bloque{max-width:660px}

/* ---------- formulario ---------- */
.campo{margin-bottom:20px;max-width:560px}
.campo label{display:block;font-size:15px;margin-bottom:6px;color:var(--texto)}
.campo input{
  width:100%;padding:12px 14px;font-size:16px;font-family:inherit;
  color:var(--texto);background:var(--fondo);
  border:1px solid var(--borde);border-radius:var(--radio);outline:none;
}
.campo input::placeholder{color:var(--texto-suave);opacity:.7}
.campo input:focus{border-color:var(--acento);box-shadow:0 0 0 3px rgba(0,255,255,.20)}
.campo input.aviso{border-color:var(--alerta);box-shadow:none}
.nota-aviso{
  display:none;margin-top:8px;font-size:13px;line-height:1.45;
  color:var(--alerta);background:var(--superficie);
  border:1px solid var(--alerta);border-radius:8px;padding:8px 10px;
}
.nota-aviso.visible{display:block}

/* ---------- botones ---------- */
.modos{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:36px}
.modo-btn{
  display:block;width:100%;text-align:left;padding:24px;
  font-family:inherit;font-size:18px;font-weight:700;color:var(--texto);
  background:var(--superficie);
  border:1px solid var(--borde);border-left:4px solid var(--secundario);
  border-radius:var(--radio);cursor:pointer;
}
.modo-btn span{display:block;margin-top:6px;font-size:14px;font-weight:400;color:var(--texto-suave)}
.modo-btn:hover{border-color:var(--acento);border-left-color:var(--acento)}
.btn{
  display:inline-block;padding:14px 26px;font-family:inherit;font-size:16px;font-weight:700;
  border-radius:var(--radio);border:1px solid var(--acento-solido);
  background:var(--acento-solido);color:var(--acento-tinta);cursor:pointer;
}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-sec{background:transparent;color:var(--texto);border-color:var(--borde)}
.btn-sec:hover{border-color:var(--texto-suave)}
.barra-btn{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px}

/* ---------- diagnostico ---------- */
.cifra{
  font-size:76px;line-height:1.02;font-weight:800;letter-spacing:-.035em;
  margin:0;color:var(--texto);word-break:break-word;
}
.cifra-anio{font-size:22px;font-weight:600;color:var(--texto-suave);margin-top:8px}
.veredicto{font-size:22px;line-height:1.4;font-weight:600;max-width:640px;margin:28px 0 0;color:var(--texto)}
.bloque{margin-top:48px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.chip{
  font-size:13px;padding:6px 14px;border:1px solid var(--borde);
  border-radius:999px;color:var(--texto-suave);background:var(--superficie);
}
.chip b{color:var(--texto);font-weight:700}
.est-sano{color:var(--sano);font-weight:700}
.est-alerta{color:var(--alerta);font-weight:700}
.est-grave{color:var(--grave);font-weight:700}

.fila-embudo{display:grid;grid-template-columns:230px 1fr 112px;align-items:center;gap:14px;margin-bottom:10px}
.fe-label{font-size:14px;color:var(--texto-suave)}
.fe-track{background:var(--superficie);border-radius:6px;height:30px;overflow:hidden}
.fe-bar{height:100%;border-radius:6px;background:var(--secundario)}
.fe-bar.alerta{background:var(--alerta)}
.fe-bar.grave{background:var(--grave)}
.fe-num{font-size:14px;text-align:right;white-space:nowrap;color:var(--texto)}
.fe-num b{font-size:16px}
.fe-num span{display:block;color:var(--texto-suave);font-size:13px}

table{width:100%;border-collapse:collapse;font-size:15px}
th{
  text-align:left;font-size:11px;letter-spacing:.10em;text-transform:uppercase;
  color:var(--texto-suave);font-weight:700;padding:0 10px 10px 0;
  border-bottom:1px solid var(--borde);
}
td{padding:12px 10px 12px 0;border-bottom:1px solid var(--borde);vertical-align:top;color:var(--texto)}
tr.rota td{background:var(--fila-rota);font-weight:700}
tr.rota td:first-child{box-shadow:inset 3px 0 0 var(--grave)}
.tabla-envoltorio{overflow-x:auto}

ul.puntos{margin:0;padding:0;list-style:none}
ul.puntos li{position:relative;padding-left:22px;margin-bottom:12px;max-width:660px}
ul.puntos li:before{
  content:"";position:absolute;left:0;top:8px;width:8px;height:8px;
  border-radius:2px;background:var(--vineta);
}
ol.pasos{margin:0;padding-left:20px;max-width:660px}
ol.pasos li{margin-bottom:10px}
ol.pasos li::marker{color:var(--texto-suave)}
.total-paso{
  margin-top:18px;padding-top:16px;border-top:1px solid var(--borde);
  font-size:18px;font-weight:700;max-width:660px;color:var(--texto);
}
.caja{
  border:1px solid var(--secundario);border-radius:var(--radio);
  padding:26px;max-width:680px;background:var(--superficie);
}
.pregunta-grande{font-size:30px;line-height:1.25;font-weight:800;margin:0;max-width:620px;color:var(--texto)}

/* ---------- responsive ---------- */
@media (max-width:640px){
  .app{padding:24px 16px 72px}
  .cabecera{flex-direction:column;align-items:flex-start;gap:14px}
  .logo{height:46px}
  .cifra{font-size:52px}
  .veredicto{font-size:19px}
  .pregunta-grande{font-size:24px}
  .modos{grid-template-columns:1fr}
  .fila-embudo{grid-template-columns:1fr;gap:4px;margin-bottom:18px}
  .fe-num{text-align:left}
  .fe-num span{display:inline;margin-left:8px}
}
@media (max-width:380px){
  .app{padding:20px 14px 64px}
  .cifra{font-size:42px}
  .btn{width:100%;text-align:center}
}

/* =========================================================
   PLANTILLA PDF
   Redefine los tokens en claro: el informe se imprime igual
   aunque la pantalla este en modo oscuro.
   ========================================================= */
#pdf-oculto{position:fixed;left:-10000px;top:0;width:794px}
#pdf-template{
  --fondo:#FFFFFF;
  --superficie:#F1F3F9;
  --texto:#0B0B12;
  --texto-suave:#5C6070;
  --borde:#E3E5EF;
  --acento:#0093A6;
  --secundario:#7B00FF;
  --vineta:#7B00FF;
  --sano:#0E9F6E;
  --alerta:#B45309;
  --grave:#DC2626;
  --fila-rota:#FDF1F1;
  width:794px;background:#FFFFFF;color:#0B0B12;
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
#pdf-template .hoja{padding:44px 52px}
#pdf-template .p-logo{height:46px;width:auto;display:block}
#pdf-template .p-marca{font-size:13px;font-weight:800;letter-spacing:.24em;text-transform:uppercase}
#pdf-template .p-linea{height:2px;background:#0B0B12;margin:12px 0 30px}
#pdf-template h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
#pdf-template .p-fecha{font-size:12px;color:#5C6070;margin:0 0 30px}
#pdf-template h2{font-size:11px;letter-spacing:.12em;color:#5C6070;margin:0 0 12px}
#pdf-template .p-bloque{margin-bottom:28px;page-break-inside:avoid}
#pdf-template table{font-size:13px}
#pdf-template th{font-size:10px}
#pdf-template td{padding:8px 10px 8px 0}
#pdf-template .p-cifra{font-size:50px;font-weight:800;letter-spacing:-.035em;line-height:1.04;margin:0}
#pdf-template .p-anio{font-size:16px;color:#5C6070;margin-top:4px}
#pdf-template .p-veredicto{font-size:16px;font-weight:700;line-height:1.4;margin:0;max-width:620px}
#pdf-template ol,#pdf-template ul{font-size:13px}
#pdf-template ul.puntos li{margin-bottom:9px}
#pdf-template .total-paso{font-size:15px;margin-top:14px;padding-top:12px}
#pdf-template .fila-embudo{grid-template-columns:196px 1fr 104px;gap:12px;margin-bottom:8px}
#pdf-template .fe-track{height:24px}
#pdf-template .fe-label{font-size:12px}
#pdf-template .fe-num{font-size:12px;text-align:right}
#pdf-template .fe-num b{font-size:14px}
#pdf-template .fe-num span{display:block;margin-left:0;font-size:11px}
#pdf-template .p-pie{
  margin-top:36px;padding-top:14px;border-top:1px solid #E3E5EF;
  font-size:10px;line-height:1.6;color:#5C6070;page-break-inside:avoid;
}

/* ---------- impresion ---------- */
@media print{
  .no-print{display:none !important}
  .app{display:none !important}
  body{background:#FFFFFF}
  #pdf-oculto{position:static;left:0;top:0;width:100%}
  #pdf-template{width:100%}
  #pdf-template .hoja{padding:0}
}
</style>
</head>
<body>

<div class="app">

  <header class="cabecera">
    <div class="identidad">
      <img id="logo" class="logo oculto" alt="EVO LAUNCH">
      <div class="marca-txt" id="marca-txt">EVO LAUNCH</div>
      <div class="marca-sub" id="sub">Diagnóstico de embudo</div>
    </div>
    <button class="tema-btn no-print" id="btn-tema" type="button">
      <span id="tema-icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
      <span id="tema-txt">Modo oscuro</span>
    </button>
  </header>

  <!-- ============ VISTA 1 - SELECTOR DE MODO ============ -->
  <section id="v1" class="vista activa">

    <h1>Empecemos por lo básico</h1>
    <p class="suave texto-bloque">Anota el nombre de la persona con la que estás hablando y cómo se llama lo que vende. Se usa en el informe que se le envía al final.</p>

    <div class="campo">
      <label for="prospecto">Nombre del prospecto</label>
      <input type="text" id="prospecto" autocomplete="off" placeholder="Ejemplo: Daniel Rojas">
    </div>

    <div class="campo">
      <label for="negocio">Nombre de su negocio o programa</label>
      <input type="text" id="negocio" autocomplete="off" placeholder="Ejemplo: Método Cuerpo Libre">
    </div>

    <div class="modos">
      <button class="modo-btn" id="btn-modo-b" type="button">
        Invierte en publicidad
        <span>Tiene números de pauta y formularios.</span>
      </button>
      <button class="modo-btn" id="btn-modo-a" type="button">
        Vende solo en orgánico
        <span>Vende por conversaciones, sin pauta.</span>
      </button>
    </div>
  </section>

  <!-- ============ VISTA 2 - CAPTURA DE DATOS ============ -->
  <section id="v2" class="vista">
    <h1 id="v2-titulo">Los números del mes pasado</h1>
    <p class="suave texto-bloque">Un mes cerrado y reciente. Números absolutos, no porcentajes.</p>

    <div id="campos"></div>

    <div class="barra-btn no-print">
      <button class="btn" id="btn-calcular" type="button" disabled>Ver diagnóstico</button>
      <button class="btn btn-sec" id="btn-atras-1" type="button">Volver</button>
    </div>
  </section>

  <!-- ============ VISTA 3 - DIAGNOSTICO ============ -->
  <section id="v3" class="vista">
    <div id="diagnostico"></div>

    <div class="barra-btn no-print">
      <button class="btn" id="btn-pdf" type="button">Descargar PDF</button>
      <button class="btn btn-sec" id="btn-atras-2" type="button">Volver a los números</button>
    </div>
    <p class="mini no-print" id="pdf-aviso" style="margin-top:14px"></p>
  </section>

</div>

<!-- ============ PLANTILLA OCULTA PARA EL PDF ============ -->
<div id="pdf-oculto" aria-hidden="true">
  <div id="pdf-template"><div class="hoja" id="pdf-hoja"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    'Reagendamiento inmediato de quien avisa que no puede, en lugar de darlo por perdido.',
    'Que los espacios que se liberan se vuelvan a ocupar el mismo día.'
  ],

    'Una misma estructura de conversación para todas las llamadas, con las objeciones frecuentes ya resueltas.',
    'Seguimiento de quienes no compraron el mismo día, durante las semanas siguientes.',

};

var QUE_PASA_A = 'Tus conversiones no son el problema: lo que llega, lo cierras. El límite está en que cada paso del recorrido depende de tu tiempo, y tu tiempo es fijo. Mientras el volumen dependa de tus horas, crecer significa trabajar más, no facturar más.';

var ARREGLAR_A = [
  'Que el primer contacto ocurra apenas alguien muestra interés, sin que tú lo escribas.',
  'Que el seguimiento de quien no respondió continúe durante días, sin que tú lo recuerdes.',
  'Que la conversación llegue a ti solo cuando ya está lista para una llamada de venta.',
  'Que puedas multiplicar el volumen de conversaciones sin agregar una hora más a tu semana.'
];

var CUERPO_SANO = 'Tus números están dentro de rango en las cuatro etapas. Eso significa que tu límite no es la conversión: es el volumen. Y el volumen tiene un costo que no está en la publicidad.';

/* =========================================================
   UTILIDADES
   ========================================================= */
function $(id){ return document.getElementById(id); }

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function dinero(n){
  if(n===null || !isFinite(n)) return '—';
  return '$' + Math.round(n).toLocaleString('en-US');
}
function entero(n){
  if(n===null || !isFinite(n)) return '—';
  return Math.round(n).toLocaleString('en-US');
}
function pct(t){
  if(t===null || !isFinite(t)) return '—';
  return Math.round(t*100) + '%';
}
function decimal(n,d){
  if(n===null || !isFinite(n)) return '—';
  var r = Math.round(n*Math.pow(10,d))/Math.pow(10,d);
  return (r % 1 === 0) ? String(r) : r.toFixed(d);
}
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
             'agosto','septiembre','octubre','noviembre','diciembre'];
function hoyISO(){
  var d=new Date(), m=String(d.getMonth()+1), dd=String(d.getDate());
  if(m.length<2) m='0'+m;
  if(dd.length<2) dd='0'+dd;
  return d.getFullYear()+'-'+m+'-'+dd;
}
function hoyLargo(){
  var d=new Date();
  return d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear();
}
function limpiarNombre(s){
  var t = String(s||'').trim();
  if(!t) return 'Prospecto';
  t = t.normalize ? t.normalize('NFD').replace(/[\u0300-\u036f]/g,'') : t;
  t = t.replace(/[^A-Za-z0-9 ]/g,'').trim().replace(/\s+/g,'-');
  return t || 'Prospecto';
}

function irA(id){

var logoClaroListo = false;

function aplicarTema(){

function iniciarLogo(){

  img.onload  = function(){
    img.classList.remove('oculto');

  img.onerror = function(){

/* =========================================================
   VISTA 2 - CAMPOS Y VALIDACION
   ========================================================= */
function defsActuales(){ return estado.modo==='B' ? CAMPOS_B : CAMPOS_A; }
function cadenaActual(){ return estado.modo==='B' ? CADENA_B : CADENA_A; }

function pintarCampos(){
  var h = '';
  defsActuales().forEach(function(c){
    h += '<div class="campo">'
      +  '<label for="f-'+c.id+'">'+esc(c.label)+'</label>'
      +  '<input type="number" inputmode="decimal" min="0" step="'+(c.entero?'1':'any')+'" '
      +  'id="f-'+c.id+'" autocomplete="off" placeholder="'+esc(c.ph)+'">'
      +  '<div class="nota-aviso" id="n-'+c.id+'">'+AVISO_CADENA+'</div>'
      +  '</div>';
  });
  $('campos').innerHTML = h;
  defsActuales().forEach(function(c){
    $('f-'+c.id).addEventListener('input', validar);
  });
  $('v2-titulo').textContent = estado.modo==='B'
    ? 'Los números del mes pasado'
    : 'Cómo fue el mes pasado';
  validar();
}

function leerCampos(){
  var v = {};
  defsActuales().forEach(function(c){
    var el = $('f-'+c.id);
    var raw = el ? el.value.trim() : '';
    var n = (raw==='') ? null : Number(raw);
    v[c.id] = (raw==='' || !isFinite(n) || n<0) ? null : n;
  });
  return v;
}

function validar(){
  var v = leerCampos();
  var completo = true;
  defsActuales().forEach(function(c){
    if(v[c.id]===null) completo = false;
  });

  cadenaActual().forEach(function(par){
    var hijo = par[0], padre = par[1];
    var mal = (v[hijo]!==null && v[padre]!==null && v[hijo] > v[padre]);
    var inp = $('f-'+hijo), nota = $('n-'+hijo);
    if(inp && nota){
      if(mal){ inp.classList.add('aviso'); nota.classList.add('visible'); }
      else   { inp.classList.remove('aviso'); nota.classList.remove('visible'); }
    }
  });

  var base = (estado.modo==='B') ? v.leads : v.contactos;
  var ok = completo && base > 0 && v.ticket > 0;
  $('btn-calcular').disabled = !ok;
  return v;
}

/* =========================================================
   CALCULO - MODO B (CON PAUTA)
   ========================================================= */
function tasa(n,d){ return (d>0) ? n/d : null; }

function estadoTramo(t,k){
  if(t===null) return 'grave';
  if(t >= PISO[k])   return 'sano';
  if(t >= ALERTA[k]) return 'alerta';
  return 'grave';
}
function estadoRoas(r){
  if(r===null) return null;
  if(r >= 3)   return 'sano';
  if(r >= 1.5) return 'alerta';
  return 'grave';
}
function etiquetaEstado(e){
  return e==='sano' ? 'Sano' : (e==='alerta' ? 'Alerta' : 'Grave');
}
function puntaje(t,k){ return (t===null) ? 0 : t/PISO[k]; }

function calcularB(d){
  var t = {
    calificacion : tasa(d.calificados, d.leads),
    agendamiento : tasa(d.agendas,     d.calificados),
    asistencia   : tasa(d.asistencias, d.agendas),
    cierre       : tasa(d.ventas,      d.asistencias)
  };
  var conteos = [d.leads, d.calificados, d.agendas, d.asistencias, d.ventas];
  var facturacion = d.ventas * d.ticket;
  var roas = (d.pauta > 0) ? facturacion / d.pauta : null;

  var sc = {}, sano = true;
  TRAMOS.forEach(function(k){
    sc[k] = puntaje(t[k], k);
    if(sc[k] < 1) sano = false;
  });

  /* --- embudo sano: no se fabrica un problema --- */
  if(sano){
    var pasosD = [];
    var vD = d.leads * 2;
    pasosD.push('El doble de contactos: ' + entero(vD) + ' personas dejando sus datos.');
    vD = vD * t.calificacion;
    pasosD.push('Con tu misma tasa de calificación (' + pct(t.calificacion) + '): ' + entero(vD) + ' que sí pueden comprarte.');
    vD = vD * t.agendamiento;
    pasosD.push('Con tu misma tasa de agendamiento (' + pct(t.agendamiento) + '): ' + entero(vD) + ' llamadas agendadas.');
    vD = vD * t.asistencia;
    pasosD.push('Con tu misma tasa de asistencia (' + pct(t.asistencia) + '): ' + entero(vD) + ' personas conectadas.');
    vD = vD * t.cierre;
    var ventasDobles = Math.floor(vD);
    pasosD.push('Con tu misma tasa de cierre (' + pct(t.cierre) + '): ' + entero(ventasDobles) + ' ventas.');
    return {
      modo:'B', sano:true, datos:d, t:t, conteos:conteos,
      facturacion:facturacion, roas:roas, estadoRoas:estadoRoas(roas),
      fuga:null,
      titular:'Tu embudo funciona.',
      cuerpo:CUERPO_SANO,
      pasos:pasosD,
      totalPaso:'Serían ' + entero(Math.max(0, ventasDobles - d.ventas)) + ' clientes nuevos al mes, calculados con tus propias tasas.',
      pregunta:'¿Podrías atender el doble de clientes el mes que viene?',
      tabla:tablaTramos(t, null),
      embudo:filasEmbudo(conteos, t, null)
    };
  }

  /* --- seleccion determinista de la fuga --- */
  var fuga = null, min = Infinity;
  TRAMOS.forEach(function(k){
    if(sc[k] < min){ min = sc[k]; fuga = k; }
  });

  /* --- proyeccion: la fuga sube al piso, lo de abajo usa sus tasas --- */
  var idx = TRAMOS.indexOf(fuga);
  var v = conteos[idx];
  var pasos = [], usoPisoAbajo = false, detalle = [];
  for(var i = idx; i < TRAMOS.length; i++){
    var k = TRAMOS[i], r, conPiso = false;
    if(i === idx){ r = PISO[k]; conPiso = true; }
    else {
      r = t[k];
      if(r === null || r === 0){ r = PISO[k]; conPiso = true; usoPisoAbajo = true; }
    }
    v = v * r;
    detalle.push({ tramo:k, tasa:r, conPiso:conPiso, valor:v });
  }
  var ventasProy = v;
  var ventasProyMostrar = Math.floor(ventasProy);
  var ventasPerdidas = Math.max(0, ventasProyMostrar - d.ventas);
  var dineroMes = ventasPerdidas * d.ticket;
  var mostrarCifra = dineroMes >= d.ticket;

  /* --- aritmetica escrita paso a paso --- */
  pasos.push('Ya pagaste por ' + entero(conteos[idx]) + ' ' + ENTRADA[fuga] + '.');
  detalle.forEach(function(p, j){
    var esUltimo = (j === detalle.length - 1);
    var valorTexto = esUltimo ? entero(Math.floor(p.valor)) : entero(p.valor);
    if(j === 0){
      pasos.push('Si el ' + pct(p.tasa) + ' llegara a ' + SALIDA[p.tramo]
        + ', que es el mínimo esperable, en lugar de tu ' + pct(t[fuga]) + ' actual: '
        + valorTexto + ' ' + SALIDA[p.tramo] + '.');
    } else if(p.conPiso){
      pasos.push('Con el mínimo esperable de ' + NOMBRE_TASA[p.tramo] + ' (' + pct(p.tasa) + '): '
        + valorTexto + ' ' + SALIDA[p.tramo] + '.');
    } else {
      pasos.push('Con tu misma tasa de ' + NOMBRE_TASA[p.tramo] + ' (' + pct(p.tasa) + '): '
        + valorTexto + ' ' + SALIDA[p.tramo] + '.');
    }
  });

  var nota = null;
  if(fuga === 'cierre' && d.ventas === 0){
    nota = 'Estimado con el mínimo esperable de cierre para tu tipo de programa, porque el mes pasado no hubo ventas que medir.';
  } else if(usoPisoAbajo){
    nota = 'Estimado con el mínimo esperable en las etapas donde el mes pasado no hubo volumen que medir.';
  }

  return {
    modo:'B', sano:false, datos:d, t:t, conteos:conteos,
    facturacion:facturacion, roas:roas, estadoRoas:estadoRoas(roas),
    fuga:fuga,
    ventasProy:ventasProyMostrar,
    ventasPerdidas:ventasPerdidas,
    dineroMes:dineroMes,
    dineroAnio:dineroMes * 12,
    mostrarCifra:mostrarCifra,
    nota:nota,
    veredicto:VEREDICTO[fuga],
    quePasa:QUE_PASA[fuga],
    arreglar:ARREGLAR[fuga],
    pasos:mostrarCifra ? pasos : null,
    totalPaso:mostrarCifra
      ? (entero(ventasProyMostrar) + ' ventas en lugar de ' + entero(d.ventas) + '. Son '
         + entero(ventasPerdidas) + (ventasPerdidas === 1 ? ' venta' : ' ventas') + ' × '
         + dinero(d.ticket) + ' = ' + dinero(dineroMes) + ' al mes.')
      : null,
    tabla:tablaTramos(t, fuga),
    embudo:filasEmbudo(conteos, t, fuga)
  };
}

function tablaTramos(t, fuga){
  return TRAMOS.map(function(k){
    return {
      tramo:NOMBRE_TRAMO[k],
      pct:pct(t[k]),
      rango:RANGO_SANO[k],
      estado:estadoTramo(t[k], k),
      rota:(k === fuga)
    };
  });
}

function filasEmbudo(conteos, t, fuga){
  var base = conteos[0] > 0 ? conteos[0] : 1;
  var filas = [{ etapa:ETAPAS_EMBUDO[0], valor:conteos[0], pct:null, estado:'sano', rota:false }];
  TRAMOS.forEach(function(k, i){
    filas.push({
      etapa:ETAPAS_EMBUDO[i+1],
      valor:conteos[i+1],
      pct:pct(t[k]),
      estado:estadoTramo(t[k], k),
      rota:(k === fuga)
    });
  });
  filas.forEach(function(f){
    f.ancho = Math.max(1.5, (f.valor / base) * 100);
  });
  return filas;
}

/* =========================================================
   CALCULO - MODO A (ORGANICO)
   En organico no hay benchmark. El limite no es la fuga:
   es el techo de horas.
   ========================================================= */
function calcularA(d){
  var facturacion   = d.ventas * d.ticket;
  var valorHora     = (d.horas > 0) ? facturacion / d.horas : null;
  var horasPorVenta = (d.horas > 0 && d.ventas > 0) ? d.horas / d.ventas : null;
  var conAritmetica = (d.horas > 0 && d.ventas > 0);

  var volumen = [
    { etapa:'Inició conversación',  valor:d.contactos,      pct:null },
    { etapa:'Conversación real',    valor:d.conversaciones, pct:pct(tasa(d.conversaciones, d.contactos)) },
    { etapa:'Llamadas de venta',    valor:d.llamadas,       pct:pct(tasa(d.llamadas, d.conversaciones)) },
    { etapa:'Compraron',            valor:d.ventas,         pct:pct(tasa(d.ventas, d.llamadas)) }
  ];

  var res = {
    modo:'A', sano:false, datos:d, facturacion:facturacion,
    valorHora:valorHora, horasPorVenta:horasPorVenta,
    conAritmetica:conAritmetica, volumen:volumen,
    quePasa:QUE_PASA_A, arreglar:ARREGLAR_A, nota:null
  };

  if(conAritmetica){
    res.titular   = 'Cada venta te cuesta ' + decimal(horasPorVenta, 1) + ' horas de tu tiempo.';
    res.subCifra  = 'Tu hora vale ' + dinero(valorHora) + '.';
    res.veredicto = 'Tu problema no es que no sepas vender. Es que cada venta pasa por ti. '
                  + 'Para facturar el doble necesitarías ' + decimal(d.horas * 2, 1)
                  + ' horas al mes. Esas horas no existen en tu semana.';
    res.pasos = [
      'El mes pasado facturaste ' + dinero(facturacion) + ' en ' + decimal(d.horas, 1) + ' horas tuyas.',
      'Eso son ' + dinero(valorHora) + ' por cada hora que pusiste.',
      'Cada venta te tomó ' + decimal(horasPorVenta, 1) + ' horas.',
      'Para hacer el doble de ventas necesitarías ' + decimal(d.horas * 2, 1) + ' horas al mes.'
    ];
    res.totalPaso = 'El techo no es tu capacidad de vender. Es la cantidad de horas que tiene tu semana.';
  } else {
    res.titular   = 'Así se movió tu mes.';
    res.subCifra  = null;
    res.veredicto = 'Sin horas registradas o sin ventas cerradas el mes pasado no se puede medir '
                  + 'cuánto te cuesta cada venta en tiempo. Estos son los números de volumen tal como los diste.';
    res.pasos     = null;
    res.totalPaso = null;
    res.quePasa   = 'Con estos números todavía no se puede medir cuánto tiempo tuyo consume cada venta. '
                  + 'Lo que sí se ve es el volumen: cuántas conversaciones llegan a una llamada y cuántas llamadas terminan en cliente.';
  }
  return res;
}

    var clase = f.rota ? 'grave' : (f.estado === 'alerta' ? 'alerta' : '');

      +  '<div class="fe-label">' + esc(f.etapa) + '</div>'
      +  '<div class="fe-track"><div class="fe-bar ' + clase + '" style="width:' + f.ancho.toFixed(1) + '%"></div></div>'
      +  '<div class="fe-num"><b>' + entero(f.valor) + '</b>'
      +  '<span>' + (f.pct ? f.pct + ' del paso anterior' : 'base') + '</span></div>'
      +  '</div>';
  });

function htmlTabla(tabla){

function htmlLista(items){

  items.forEach(function(i){ h += '<li>' + esc(i) + '</li>'; });

function htmlPasos(pasos, total){

function pintarDiagnostico(dx){
  var h = '';

  /* ---- 1. cifra o titular ---- */
  if(dx.modo === 'B' && dx.sano){
    h += '<h1 class="cifra">' + esc(dx.titular) + '</h1>';
    h += '<p class="veredicto">' + esc(dx.cuerpo) + '</p>';
  } else if(dx.modo === 'B'){
    if(dx.mostrarCifra){
      h += '<p class="cifra">' + dinero(dx.dineroMes) + ' al mes</p>';
      h += '<p class="cifra-anio">' + dinero(dx.dineroAnio) + ' al año</p>';
      if(dx.nota) h += '<p class="mini" style="margin-top:10px;max-width:560px">' + esc(dx.nota) + '</p>';
    }
    h += '<p class="veredicto">' + esc(dx.veredicto) + '</p>';
  } else {
    h += '<p class="cifra">' + esc(dx.titular) + '</p>';
    if(dx.subCifra) h += '<p class="cifra-anio">' + esc(dx.subCifra) + '</p>';
    h += '<p class="veredicto">' + esc(dx.veredicto) + '</p>';
  }

  /* ---- 2. indicadores de encabezado ---- */
  if(dx.modo === 'B'){
    h += '<div class="chips">';
    h += '<div class="chip">Facturación del mes: <b>' + dinero(dx.facturacion) + '</b></div>';
    if(dx.roas !== null){
      h += '<div class="chip">Retorno sobre publicidad: <b>' + decimal(dx.roas, 1)
        +  '</b> <span class="est-' + dx.estadoRoas + '">' + etiquetaEstado(dx.estadoRoas) + '</span></div>';
    }
    h += '</div>';
  } else {
    h += '<div class="chips"><div class="chip">Facturación del mes: <b>' + dinero(dx.facturacion) + '</b></div>';
    if(dx.valorHora !== null){
      h += '<div class="chip">Horas invertidas: <b>' + decimal(dx.datos.horas, 1) + '</b></div>';
    }
    h += '</div>';
  }

  /* ---- 3. embudo y tramos ---- */
  if(dx.modo === 'B'){
    h += '<div class="bloque"><h2>Tu embudo, etapa por etapa</h2>' + htmlEmbudo(dx.embudo) + '</div>';
    h += '<div class="bloque"><h2>Análisis por tramo</h2>' + htmlTabla(dx.tabla) + '</div>';
  } else {
    h += '<div class="bloque"><h2>Tu volumen del mes</h2>' + htmlTablaVolumen(dx.volumen) + '</div>';
  }

  /* ---- 4. que esta pasando ---- */
  if(dx.quePasa){
    h += '<div class="bloque"><h2>Qué está pasando</h2>'
      +  '<p class="texto-bloque">' + esc(dx.quePasa) + '</p></div>';
  }

  /* ---- 5. la aritmetica ---- */
  if(dx.pasos){
    h += '<div class="bloque"><h2>' + tituloPasos(dx) + '</h2>'
      +  htmlPasos(dx.pasos, dx.totalPaso) + '</div>';
  }

  /* ---- 6. que hay que arreglar ---- */
  if(dx.arreglar){
    h += '<div class="bloque"><h2>Qué hay que arreglar</h2>' + htmlLista(dx.arreglar) + '</div>';
  }

  /* ---- 7. la pregunta de capacidad ---- */
  if(dx.pregunta){
    h += '<div class="bloque"><div class="caja"><p class="pregunta-grande">'
      +  esc(dx.pregunta) + '</p></div></div>';
  }

  $('diagnostico').innerHTML = h;
}

function tituloPasos(dx){
  if(dx.modo === 'B' && dx.sano) return 'Qué pasaría con el doble de volumen';
  if(dx.modo === 'A') return 'Tu aritmética del mes';
  return 'Qué habría pasado';
}

/* =========================================================
   PLANTILLA PDF - contenedor propio, ancho A4
   ========================================================= */
function numerosCompartidos(dx){
  var d = dx.datos, filas = [];
  if(dx.modo === 'B'){
    filas.push(['Inversión en publicidad', dinero(d.pauta)]);
    filas.push(['Precio del programa', dinero(d.ticket)]);
    filas.push(['Personas que dejaron sus datos', entero(d.leads)]);
    filas.push(['De esas, las que podían comprar', entero(d.calificados)]);
    filas.push(['Agendaron una llamada', entero(d.agendas)]);
    filas.push(['Se conectaron el día de la llamada', entero(d.asistencias)]);
    filas.push(['Compraron', entero(d.ventas)]);
  } else {
    filas.push(['Precio del programa', dinero(d.ticket)]);
    filas.push(['Personas contactadas', entero(d.contactos)]);
    filas.push(['Conversaciones reales', entero(d.conversaciones)]);
    filas.push(['Llamadas de venta', entero(d.llamadas)]);
    filas.push(['Compraron', entero(d.ventas)]);
    filas.push(['Horas invertidas en el mes', decimal(d.horas, 1)]);
  }
  return filas;
}

function pintarPDF(dx){
  var nombre = estado.prospecto || 'Prospecto';
  var h = '';

  h += logoClaroListo
     ? '<img class="p-logo" src="' + esc(MARCA.logoClaro) + '" alt="' + esc(MARCA.nombre) + '">'
     : '<div class="p-marca">' + esc(MARCA.nombre) + '</div>';
  h += '<div class="p-linea"></div>';
  h += '<h1>Diagnóstico de embudo — ' + esc(nombre) + '</h1>';
  h += '<p class="p-fecha">' + (estado.negocio ? esc(estado.negocio) + ' — ' : '') + hoyLargo() + '</p>';

  h += '<div class="p-bloque"><h2>Los números que compartiste</h2><table><tbody>';
  numerosCompartidos(dx).forEach(function(f){
    h += '<tr><td style="width:62%">' + esc(f[0]) + '</td><td><b>' + f[1] + '</b></td></tr>';
  });
  h += '</tbody></table></div>';

  if(dx.modo === 'B'){
    h += '<div class="p-bloque"><h2>Tu embudo, etapa por etapa</h2>' + htmlEmbudo(dx.embudo) + '</div>';
    h += '<div class="p-bloque"><h2>Análisis por tramo</h2>' + htmlTabla(dx.tabla) + '</div>';
  } else {
    h += '<div class="p-bloque"><h2>Tu volumen del mes</h2>' + htmlTablaVolumen(dx.volumen) + '</div>';
  }

  h += '<div class="p-bloque">';
  if(dx.modo === 'B' && dx.sano){
    h += '<p class="p-cifra">' + esc(dx.titular) + '</p>';
    h += '<p class="p-veredicto" style="margin-top:16px">' + esc(dx.cuerpo) + '</p>';
  } else if(dx.modo === 'B'){
    if(dx.mostrarCifra){
      h += '<p class="p-cifra">' + dinero(dx.dineroMes) + ' al mes</p>';
      h += '<p class="p-anio">' + dinero(dx.dineroAnio) + ' al año</p>';
      if(dx.nota){
        h += '<p style="font-size:11px;color:#64748B;margin-top:8px;max-width:520px">' + esc(dx.nota) + '</p>';
      }
    }
    h += '<p class="p-veredicto" style="margin-top:16px">' + esc(dx.veredicto) + '</p>';
  } else {
    h += '<p class="p-cifra" style="font-size:32px">' + esc(dx.titular) + '</p>';
    if(dx.subCifra) h += '<p class="p-anio">' + esc(dx.subCifra) + '</p>';
    h += '<p class="p-veredicto" style="margin-top:16px">' + esc(dx.veredicto) + '</p>';
  }
  h += '</div>';

  if(dx.pasos){
    h += '<div class="p-bloque"><h2>' + tituloPasos(dx) + '</h2>'
      +  htmlPasos(dx.pasos, dx.totalPaso) + '</div>';
  }
  if(dx.quePasa){
    h += '<div class="p-bloque"><h2>Qué está pasando</h2>'
      +  '<p style="max-width:620px">' + esc(dx.quePasa) + '</p></div>';
  }
  /* 'Qué hay que arreglar' vive solo en pantalla: el PDF se queda en
     el diagnóstico, sin la lista de lo que habría que resolver. */
  if(dx.pregunta){
    h += '<div class="p-bloque"><h2>La pregunta que queda abierta</h2>'
      +  '<p style="font-size:20px;font-weight:700;max-width:560px">' + esc(dx.pregunta) + '</p></div>';
  }

  h += '<div class="p-pie">' + esc(MARCA.nombre) + ' — ' + esc(MARCA.sitio) + '<br>'
    +  'Este análisis se construyó con los datos que compartiste el ' + hoyLargo() + '. '
    +  'Los rangos de referencia corresponden a programas de ticket alto.</div>';

  $('pdf-hoja').innerHTML = h;
}

/* =========================================================
   PDF
   ========================================================= */
function descargarPDF(){
  if(!estado.dx) return;
  var archivo = 'Diagnostico-' + limpiarNombre(estado.prospecto) + '-' + hoyISO() + '.pdf';
  var aviso = $('pdf-aviso');

  if(typeof html2pdf === 'undefined'){
    aviso.textContent = 'No se pudo cargar el generador de PDF. Se abrirá el diálogo de impresión: elige "Guardar como PDF".';
    window.print();
    return;
  }

  aviso.textContent = 'Generando el PDF...';
  html2pdf().set({
    margin: 0,
    filename: archivo,
    image: { type:'jpeg', quality:0.98 },
    html2canvas: { scale:2, backgroundColor:'#FFFFFF', letterRendering:true, useCORS:false },
    jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
    pagebreak: { mode:['css','legacy'], avoid:['.p-bloque','tr','li','.p-pie'] }
  }).from($('pdf-template')).save().then(function(){
    aviso.textContent = '';
  })['catch'](function(){
    aviso.textContent = 'No se pudo generar el PDF. Usa el diálogo de impresión y elige "Guardar como PDF".';
  });
}

/* =========================================================
   EVENTOS
   ========================================================= */
function guardarNombres(){
  estado.prospecto = $('prospecto').value.trim();
  estado.negocio   = $('negocio').value.trim();
}

function abrirModo(modo){
  guardarNombres();
  estado.modo = modo;
  pintarCampos();
  irA('v2');
}

$('btn-modo-b').addEventListener('click', function(){ abrirModo('B'); });
$('btn-modo-a').addEventListener('click', function(){ abrirModo('A'); });
$('prospecto').addEventListener('input', guardarNombres);
$('negocio').addEventListener('input', guardarNombres);

$('btn-atras-1').addEventListener('click', function(){ irA('v1'); });
$('btn-atras-2').addEventListener('click', function(){ irA('v2'); });

$('btn-calcular').addEventListener('click', function(){
  var v = validar();
  if($('btn-calcular').disabled) return;
  estado.datos = v;
  estado.dx = (estado.modo === 'B') ? calcularB(v) : calcularA(v);
  pintarDiagnostico(estado.dx);
  pintarPDF(estado.dx);
  $('pdf-aviso').textContent = '';
  irA('v3');
});

$('btn-pdf').addEventListener('click', descargarPDF);

$('btn-tema').addEventListener('click', function(){
  tema = (tema === 'oscuro') ? 'claro' : 'oscuro';
  aplicarTema();
});

iniciarLogo();
</script>
